<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>红尖 · 好友联机</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&family=Noto+Serif+SC:wght@700;900&display=swap" rel="stylesheet">
<style>
/* VOICE: 牌桌上的热闹，但规则清楚、不花哨
   IDEA: 一张真实的牌桌——绿呢台面、木质桌沿、纸牌
   PICTURE: 牌桌本身：四个座位围着中间的出牌区，出的牌落在桌子中央
   COLOUR and TYPE: 墨绿呢面 + 木色桌沿 + 朱红牌面与金色万能牌；Noto Serif SC 标题，Noto Sans SC 正文
   LAYOUT: 顶部昵称与声音开关，中间牌桌，下方手牌与存储区，右侧级数、聊天和记录 */
:root{color-scheme:light dark;--bg:light-dark(#ebe4d3,#07160f);--ink:light-dark(#1d2a22,#e9efe9);--sub:light-dark(#5b6b60,#9fb2a6);--panel:light-dark(#fffaf0,#0f2419);--line:light-dark(#d6ccb5,#24412f);--felt:#13603b;--felt2:#0b3f26;--wood:#6b4423;--gold:#e8b43a;--red:#c8102e;--a:#e8b43a;--b:#6fc3ff}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Noto Sans SC",system-ui,sans-serif;overflow-x:clip}
button{font:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
header{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;padding:14px max(4vw,14px)}
h1{font:900 34px/1.05 "Noto Serif SC",serif;margin:0;letter-spacing:.04em}
h1 small{font:500 14px "Noto Sans SC",sans-serif;color:var(--sub);margin-left:8px;letter-spacing:0}
.tabs{display:flex;gap:8px;margin-left:auto}
.tab{min-height:44px;padding:6px 16px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font-weight:700}
.tab[aria-pressed=true]{background:var(--felt);color:#fff;border-color:var(--felt)}
.tab span{font-weight:400;font-size:13px;opacity:.8;margin-left:6px}
.nickbar{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;padding:0 max(4vw,14px) 14px;max-width:1320px;margin:0 auto}
.nickbar label{font-weight:700}
.nickbar input{font:inherit;font-size:16px;min-height:44px;padding:6px 12px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--ink);width:170px}
.snd{display:flex;gap:8px;margin-left:auto;flex-wrap:wrap}
.vol{display:flex;align-items:center;gap:8px;padding:4px 12px 4px 4px;border-radius:999px;border:1px solid var(--line);background:var(--panel)}
.vol button{min-height:36px;padding:2px 12px;border-radius:999px;border:0;background:transparent;color:var(--sub);font-size:14px;white-space:nowrap}
.vol button[aria-pressed=true]{background:var(--felt);color:#fff}
.vol input{width:96px;accent-color:var(--felt);height:28px}
.vol output{font-size:12px;color:var(--sub);width:2.4em;text-align:right;font-variant-numeric:tabular-nums}
.vol.off input,.vol.off output{opacity:.4}
main{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:18px;padding:0 max(4vw,14px) 28px;max-width:1320px;margin:0 auto}
@media(max-width:900px){main{grid-template-columns:minmax(0,1fr)}}
.status{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:baseline;margin-bottom:10px;font-size:15px}
.status .lvbig{font:900 30px/1 "Noto Serif SC",serif;color:var(--felt)}
:root[data-theme=dark] .status .lvbig{color:var(--gold)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]) .status .lvbig{color:var(--gold)}}
.status .turnmsg{font-weight:700;margin-left:auto}
.felt{background:radial-gradient(ellipse at 50% 45%,#1c7a4c,var(--felt) 50%,var(--felt2));border:12px solid var(--wood);border-radius:30px;box-shadow:inset 0 0 40px rgba(0,0,0,.45),0 10px 30px rgba(0,0,0,.25);color:#f3f7f2;position:relative}
.table{display:grid;grid-template-columns:150px minmax(0,1fr) 150px;grid-template-rows:auto minmax(330px,1fr) auto;grid-template-areas:". top ." "left mid right" ". bot .";gap:10px;padding:14px}
.pl{position:relative;border-radius:14px;padding:8px 10px;background:rgba(0,0,0,.2);border:2px solid transparent;display:flex;flex-direction:column;gap:3px;align-items:center;text-align:center;align-self:center;justify-self:center;width:100%;max-width:240px}
.pl.turn{border-color:var(--gold);box-shadow:0 0 18px rgba(232,180,58,.55)}
.pos-top{grid-area:top}.pos-left{grid-area:left}.pos-right{grid-area:right}.pos-bot{grid-area:bot}
.nm{font-weight:700;font-size:15px;display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:center}
.tg{font-size:12px;font-weight:700;padding:1px 7px;border-radius:6px;color:#10231a}
.tg.t0{background:var(--a)}.tg.t1{background:var(--b)}
.meta{font-size:13px;color:#cfe3d6}
.meta .warn{color:#ffd36b;font-weight:700}
.badge{background:var(--gold);color:#3a2600;font-weight:900;font-size:13px;padding:1px 8px;border-radius:6px}
.mid{grid-area:mid;position:relative;min-height:330px}
.slot{position:absolute;display:flex;flex-direction:column;align-items:center;gap:3px}
.slot.old{opacity:.4}
.s-top{top:4px;left:50%;transform:translateX(-50%)}
.s-bot{bottom:4px;left:50%;transform:translateX(-50%)}
.s-left{left:4px;top:50%;transform:translateY(-50%)}
.s-right{right:4px;top:50%;transform:translateY(-50%);align-items:center}
.slot small{font-size:13px;font-weight:700;color:#fff;background:rgba(0,0,0,.3);padding:0 8px;border-radius:6px}
.ps{font-weight:900;color:#e2efe6;font-size:18px;padding:12px 14px;border-radius:12px;background:rgba(0,0,0,.18)}
.timer{font-variant-numeric:tabular-nums;font-weight:900}.timer.low{color:#e5484d}
.think .timer{font-size:20px;color:#ffd36b}.think .timer.low{color:#ff8a8a}
.status .btn.small{margin-left:4px}
.panel.paused{background:rgba(6,30,18,.86)}
.rdy{display:inline-block;margin-top:2px;background:#2fbf71;color:#05301b;font-weight:900;font-size:13px;padding:1px 8px;border-radius:6px}
.think{font-size:14px;color:#d8e8dd;padding:14px}
.center{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;pointer-events:none}
.center .lv{font:900 40px/1 "Noto Serif SC",serif;color:rgba(232,180,58,.35)}
.panel{position:absolute;inset:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;background:rgba(6,30,18,.72);border-radius:18px;padding:12px;z-index:4}
.panel .lv{font:900 40px/1 "Noto Serif SC",serif;color:var(--gold)}
.lvl{font-size:13px;color:#cfe3d6}
.big{font-weight:700;font-size:17px}
.btn{min-height:44px;padding:8px 20px;border-radius:12px;border:0;font-weight:700;background:var(--gold);color:#2c1d00}
.btn.sec{background:var(--panel);color:var(--ink);border:1px solid var(--line)}
.btn.ghost{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.3)}
.btn.small{min-height:34px;padding:3px 12px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.cd{width:52px;height:76px;border-radius:7px;background:#fffdf7;color:#1c1c1c;border:1px solid #c9bea5;box-shadow:0 2px 4px rgba(0,0,0,.3);position:relative;display:inline-flex;flex-direction:column;align-items:flex-start;padding:3px 5px;margin-left:-26px;line-height:1;flex:none;transition:transform .12s;user-select:none;-webkit-user-select:none}
.cd b{font-size:18px;font-weight:900}.cd i{font-style:normal;font-size:19px;margin-top:2px}
.cd.red{color:var(--red)}
.cd.joker b{font-size:14px;line-height:1.05;writing-mode:vertical-rl}
.cd.wild{background:#fff3cc;border:2px solid var(--gold)}
.cd em{position:absolute;right:3px;bottom:3px;font-style:normal;font-size:11px;font-weight:900;background:var(--gold);color:#3a2600;border-radius:4px;padding:1px 3px}
.cd u{position:absolute;right:4px;top:3px;text-decoration:none;color:#b8860b;font-size:13px}
.cd.up{transform:translateY(-16px);box-shadow:0 6px 12px rgba(0,0,0,.35)}
.cd.sweep{filter:brightness(.82);outline:2px solid #3b82f6;outline-offset:-2px}
button.cd{cursor:pointer;font:inherit}
.leftover{margin-top:14px}
.leftover h3{margin:0 0 10px;font:700 17px/1.2 "Noto Serif SC",serif}
.rv-row{display:grid;grid-template-columns:minmax(120px,200px) minmax(0,1fr);gap:8px 14px;align-items:center;padding:10px 0;border-top:1px dashed var(--line)}
.rv-row:first-of-type{border-top:0}
.rv-name{font-weight:700;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.rv-name small{font-weight:500;color:var(--sub);font-size:13px}
.rv-cards .mini{flex-wrap:wrap;row-gap:8px}
.rv-out{color:var(--sub);font-weight:700}
@media(max-width:600px){.rv-row{grid-template-columns:minmax(0,1fr)}}
.mini{display:flex;padding-left:22px}
.mini .cd{width:40px;height:58px;margin-left:-22px;padding:2px 4px;border-radius:6px}
.mini .cd b{font-size:15px}.mini .cd i{font-size:15px}.mini .cd em,.mini .cd u{display:none}.mini .cd.joker b{font-size:12px}
.handwrap{margin-top:14px;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:16px 16px 14px}
.hand{display:flex;flex-wrap:wrap;row-gap:10px;padding:18px 0 4px 26px;min-height:96px;touch-action:none}
.store{display:flex;flex-wrap:wrap;gap:10px 18px;margin-top:8px;padding-top:10px;border-top:1px dashed var(--line);align-items:flex-end}
.store .lab{font-size:13px;font-weight:700;color:var(--sub);align-self:center}
.grp{display:flex;padding:18px 8px 6px 34px;border-radius:12px;background:light-dark(#efe6cf,#173626);touch-action:none}
.ctrl{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:12px}
.ctrl .hint{color:var(--sub);font-size:14px}
.choose{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;align-items:center}
aside{display:flex;flex-direction:column;gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:14px 16px}
.card h3{margin:0 0 8px;font:700 17px/1.2 "Noto Serif SC",serif}
.team{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.team:first-of-type{border-top:0}
.team .lvn{font:900 30px/1 "Noto Serif SC",serif;margin-left:auto}
.team .who{font-size:13px;color:var(--sub)}
.log{list-style:none;margin:0;padding:0;font-size:14px;max-height:280px;overflow:auto}
.log li{padding:4px 0;border-top:1px dashed var(--line)}
.log li:first-child{border-top:0}
.lobby{padding:22px;min-height:440px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-areas:". s2 ." "s3 info s1" ". s0 .";gap:12px;align-items:center}
.seat{min-height:96px;border-radius:16px;border:2px dashed rgba(255,255,255,.45);background:rgba(0,0,0,.18);color:#fff;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:8px}
.seat.taken{border-style:solid}
.seat.t0.taken{border-color:var(--a)}.seat.t1.taken{border-color:var(--b)}
.seat.me{box-shadow:0 0 0 3px #fff inset}
.seat small{font-weight:400;font-size:13px;opacity:.85}
.info{grid-area:info;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}
.info p{margin:0;font-size:14px;color:#d8e8dd}
.info .lv{font:900 34px/1 "Noto Serif SC",serif;color:var(--gold)}
.note{padding:10px 14px;border-radius:12px;background:var(--panel);border:1px solid var(--line);margin-bottom:12px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#1d2a22;color:#fff;padding:10px 18px;border-radius:12px;font-weight:500;box-shadow:0 8px 24px rgba(0,0,0,.35);z-index:9;max-width:90vw}
.res{list-style:none;padding:0;margin:0;font-size:15px}
.small{font-size:13px;color:var(--sub)}
.bubble{position:absolute;left:50%;top:-12px;transform:translate(-50%,-100%);z-index:6;background:#fffdf7;color:#1d2a22;font-weight:700;font-size:15px;padding:8px 12px;border-radius:14px;box-shadow:0 6px 16px rgba(0,0,0,.35);max-width:220px;width:max-content;animation:pop .25s ease-out}
.bubble::after{content:"";position:absolute;left:50%;bottom:-7px;margin-left:-7px;border:7px solid transparent;border-bottom:0;border-top-color:#fffdf7}
.bubble.emo{font-size:44px;line-height:1;padding:6px 10px}
.pos-top .bubble{top:auto;bottom:-12px;transform:translate(-50%,100%);animation:none}
.pos-top .bubble::after{bottom:auto;top:-7px;border-top:0;border-bottom:7px solid #fffdf7}
@keyframes pop{from{transform:translate(-50%,-100%) scale(.6);opacity:0}}
#chatpanel h4{margin:0 0 8px;font:700 15px/1.2 "Noto Serif SC",serif}
.emos,.says{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.emos button{font-size:26px;width:48px;height:48px;border-radius:12px;border:1px solid var(--line);background:var(--bg)}
.stks{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.stks button{width:60px;height:60px;border-radius:12px;border:1px solid var(--line);background:var(--bg);padding:4px;display:flex;align-items:center;justify-content:center}
.stks img{max-width:100%;max-height:100%;border-radius:6px}
.bubble.stk{padding:6px;line-height:0}.bubble.stk img{width:84px;height:84px;object-fit:contain;border-radius:8px}
.log img.inl{height:30px;vertical-align:middle;border-radius:4px}
.says button{min-height:40px;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:14px}
.chatin{display:flex;gap:8px}.chatin input{flex:1;font:inherit;font-size:16px;min-height:44px;padding:6px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.acts{display:flex;gap:6px;justify-content:center;margin-top:2px}
.acts button{width:34px;height:34px;border-radius:10px;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.12);font-size:18px;line-height:1;padding:0}
.acts button:hover{background:rgba(255,255,255,.25)}
.fx{position:fixed;left:0;top:0;pointer-events:none;z-index:20;will-change:transform,opacity}
.fx svg{display:block}
.fxlabel{position:fixed;z-index:21;pointer-events:none;background:#fffdf7;color:#5a3317;font-weight:700;font-size:14px;padding:5px 10px;border-radius:10px;box-shadow:0 4px 12px rgba(0,0,0,.3);white-space:nowrap}
@media(max-width:600px){
 .acts button{width:28px;height:28px;font-size:15px}
 h1{font-size:28px}.tabs{margin-left:0}.snd{margin-left:0;width:100%}.vol{flex:1 1 100%}.vol input{flex:1;width:auto}
 .felt{border-width:8px;border-radius:22px}
 .table{grid-template-columns:64px minmax(0,1fr) 64px;grid-template-rows:auto minmax(360px,1fr) auto;grid-template-areas:"top top top" "left mid right" "bot bot bot";padding:8px;gap:6px}
 .pos-left .nm,.pos-right .nm{font-size:13px}
 .pl{padding:6px 4px}
 .s-left{top:92px;transform:none}.s-right{top:auto;bottom:92px;transform:none}
 .mini{padding-left:18px}.mini .cd{width:32px;height:46px;margin-left:-18px}.mini .cd b,.mini .cd i{font-size:12px}
 .cd{width:42px;height:62px;margin-left:-22px}.cd b{font-size:15px}.cd i{font-size:15px}
 .hand{padding-left:22px}.grp{padding-left:30px}
 .lobby{grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-areas:"info info" "s0 s1" "s2 s3";padding:14px}
 .center .lv{display:none}
 .status .turnmsg{margin-left:0;width:100%}
}
@media(prefers-reduced-motion:reduce){.cd{transition:none}.bubble{animation:none}}
/* ===== 红尖：深酒红牌桌 ===== */
:root{--bg:light-dark(#efe4df,#14080a);--ink:light-dark(#2a1a1d,#f1e7e8);--sub:light-dark(#6e5458,#b9a0a4);--panel:light-dark(#fffaf6,#24100f);--line:light-dark(#dcc5bf,#46232a);--felt:#7a1d2c;--felt2:#470d17}
/* 桌面中心压暗一些，看字不刺眼 */
.felt{background:radial-gradient(ellipse at 50% 45%,#6e1d2a,#561421 50%,#350912)}
.meta,.lvl,.info p{color:#e6dcdd}
.ps{color:#f6e3e6}
.think{color:#f3dde0}
.panel{background:rgba(42,6,14,.9)}
.panel.paused{background:rgba(30,4,10,.88)}
.grp{background:light-dark(#f1e1dc,#3a161c)}
.center .lv{color:rgba(232,180,58,.28);font-size:34px}
.status .lvbig{color:var(--felt)}
:root[data-theme=dark] .status .lvbig{color:var(--gold)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]) .status .lvbig{color:var(--gold)}}
a.tab{display:inline-flex;align-items:center;text-decoration:none}
.seat{border-color:rgba(255,255,255,.26);background:rgba(0,0,0,.26)}
.seat.taken{border-color:rgba(232,180,58,.75)}
.seat.me{box-shadow:0 0 0 2px rgba(232,180,58,.35) inset}
.pl{background:rgba(0,0,0,.26)}
.tg.red{background:#ffb3bd;color:#4a0f18}
/* 打出的红A：淡红色轮廓，像信号灯一样闪 4 下（每下约半秒），之后保持不闪 */
.cd.reda{position:relative;z-index:2;outline:3px solid rgba(255,150,160,.95);outline-offset:2px;box-shadow:0 0 10px 2px rgba(255,120,135,.55)}
.cd.reda.blink{animation:redablink .5s ease-in-out 4 both}
@keyframes redablink{0%,100%{outline-color:rgba(255,150,160,.95);box-shadow:0 0 14px 4px rgba(255,110,128,.75)}50%{outline-color:rgba(255,150,160,.08);box-shadow:0 0 0 0 rgba(255,110,128,0)}}
@media(prefers-reduced-motion:reduce){.cd.reda.blink{animation:none}}
/* 进贡挑牌 */
.pool{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin:4px 0}
.poolc{display:flex;flex-direction:column;align-items:center;gap:4px}
.poolc .cd{margin-left:0}
.poolbtn{border:0;background:transparent;padding:4px;border-radius:10px}
.poolbtn[aria-pressed=true]{background:rgba(232,180,58,.35);box-shadow:0 0 0 2px var(--gold)}
.poolbtn:disabled{cursor:default}
.wants{font-size:12px;color:#ffe2a6;min-height:16px;max-width:110px}
.ttimer{font-variant-numeric:tabular-nums;font-weight:900;color:#ffd36b}.ttimer.low{color:#ff8a8a}
.score{display:flex;align-items:center;gap:10px;padding:7px 0;border-top:1px solid var(--line)}
.score:first-of-type{border-top:0}
.score .pts{font:900 28px/1 "Noto Serif SC",serif;margin-left:auto;font-variant-numeric:tabular-nums}
.score.lead .pts{color:var(--felt)}
:root[data-theme=dark] .score.lead .pts{color:var(--gold)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]) .score.lead .pts{color:var(--gold)}}
.bar{height:6px;border-radius:3px;background:var(--line);margin-top:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--felt)}
.lobby .info .lv{font-size:30px}
@media(max-width:600px){.tabs{width:100%;flex-wrap:wrap}.tab{flex:1 1 auto;padding:4px 10px;font-size:14px;white-space:nowrap;justify-content:center}}
</style>
</head>
<body>
<header>
  <h1><span data-i18n="h1">红尖</span><small data-i18n="sub">好友联机 · 红A暗中组队</small></h1>
  <nav class="tabs">
    <a class="tab" href="./" data-i18n="hub">← 大厅</a>
    <button class="tab" data-act="room" data-r="h1" aria-pressed="true"><span data-i18n="room1">1号房间</span><span id="c1"></span></button>
    <button class="tab" data-act="room" data-r="h2" aria-pressed="false"><span data-i18n="room2">2号房间</span><span id="c2"></span></button>
    <button class="tab" data-act="lang" data-i18n="langBtn">English</button>
  </nav>
</header>
<div class="nickbar">
  <label for="nick" data-i18n="nick">你的昵称</label><input id="nick" maxlength="12" placeholder="例如：James" data-i18n-ph="nickPh" autocomplete="nickname">

    const v = a.volume + (on ? 0.006 : -0.009);
    a.volume = Math.max(0, Math.min(lobbyVol(), v));

  if (!want && AU.timer) { clearInterval(AU.timer); AU.timer = 0; }

  if (wantLobby !== lobby.on) { lobby.on = wantLobby; fadeLobby(wantLobby); }

        document.body.appendChild(stream);

        setTimeout(() => {
          const sn = fxEl(SVG.stain, x1 - 60, y1 - 50);
          sn.animate([{ transform: `translate(${x1 - 60}px,${y1 - 50}px) scale(.3)`, opacity: 0.9 }, { transform: `translate(${x1 - 60}px,${y1 - 50}px) scale(1)`, opacity: 1, offset: 0.1 }, { transform: `translate(${x1 - 60}px,${y1 - 50}px) scale(1)`, opacity: 1, offset: 0.7 }, { transform: `translate(${x1 - 60}px,${y1 - 50}px) scale(1)`, opacity: 0 }], { duration: 3200, fill: 'forwards' }).onfinish = () => sn.remove();
          const lb = document.createElement('div'); lb.className = 'fxlabel'; lb.textContent = T('coffeeLabel');
          document.body.appendChild(lb);

          lb.animate([{ opacity: 0 }, { opacity: 1, offset: 0.1 }, { opacity: 1, offset: 0.8 }, { opacity: 0 }], { duration: 2600, fill: 'forwards' }).onfinish = () => lb.remove();

function shake(s) {

  if (el && !reduceMotion) el.animate([{ transform: 'translateX(0)' }, { transform: 'translateX(-6px)' }, { transform: 'translateX(6px)' }, { transform: 'translateX(-4px)' }, { transform: 'translateX(0)' }], { duration: 350 });

// ================= 倒计时：出牌 40 秒，进贡每一步 15 秒 =================
function remaining(st) {
  const g = st.g;
  if (!g || st.phase !== 'play' || !g.turnAt || g.turn < 0) return null;
  const nowT = st.paused ? st.paused.at : Date.now();
  return H.TURN_SECS - (nowT - g.turnAt) / 1000;
}
function tribRemaining(st) {
  const t = st.g && st.g.trib;
  if (st.phase !== 'tribute' || !t || !t.at) return null;
  const nowT = st.paused ? st.paused.at : Date.now();
  return H.TRIB_SECS - (nowT - t.at) / 1000;
}
const timerHTML = (st) => { const r = remaining(st); if (r == null) return ''; const n = Math.max(0, Math.ceil(r)); return `<b class="timer ${n <= 10 ? 'low' : ''}">${n}</b>`; };
const ttimerHTML = (st) => { const r = tribRemaining(st); if (r == null) return ''; const n = Math.max(0, Math.ceil(r)); return `<b class="ttimer ${n <= 5 ? 'low' : ''}">${n}</b>`; };
let lastTick = null, timeoutTried = null, tribTried = null;
setInterval(() => {
  if (!ready) return;
  const st = cur(), me = st.seats.indexOf(uid);
  const tr = tribRemaining(st);
  if (tr != null) {
    const n = Math.max(0, Math.ceil(tr));
    document.querySelectorAll('.ttimer').forEach((el) => { if (el.textContent !== String(n)) el.textContent = n; el.classList.toggle('low', n <= 5); });
    const at = st.g.trib.at;
    if (!st.paused && me >= 0 && tr <= 0 && tribTried !== at) { tribTried = at; mutate((s) => H.tribTimeout(s, at)); }
    return;
  }
  const r = remaining(st);
  if (r == null) return;
  const n = Math.max(0, Math.ceil(r));
  document.querySelectorAll('.timer').forEach((el) => { if (el.textContent !== String(n)) el.textContent = n; el.classList.toggle('low', n <= 10); });
  if (st.paused) return;
  const g = st.g;
  if (g.turn === me && me >= 0 && n <= 5 && n > 0 && lastTick !== g.turnAt + ':' + n) { lastTick = g.turnAt + ':' + n; sfx('tick'); }
  // 时间到：轮到的人自己先处理；他掉线的话，其他玩家等2秒后代为处理
  if (me >= 0 && timeoutTried !== g.turnAt && ((r <= 0 && g.turn === me) || r <= -2)) {
    timeoutTried = g.turnAt;
    const at = g.turnAt;
    mutate((s) => H.timeout(s, at));
  }
}, 250);

// ================= 纸牌 =================
// 红A闪烁：按第一次在本机看到这手牌的时间算，重新画面时动画不会从头开始
const FLASH_MS = 2000, flashSeen = new Map();
let flashT = 0;
function flashStyle(key) {
  if (!flashSeen.has(key)) flashSeen.set(key, Date.now());
  const el = Date.now() - flashSeen.get(key);
  if (el >= FLASH_MS) return { cls: 'reda', style: '' };
  // 闪完以后再画一次，去掉动画（保留轮廓）
  clearTimeout(flashT); flashT = setTimeout(render, FLASH_MS - el + 30);
  return { cls: 'reda blink', style: ` style="animation-delay:-${el}ms"` };
}
function cardEl(id, cls = '', btn = false, flashKey = null) {
  const c = H.card(id);
  const red = c.s === 'H' || c.s === 'D' || c.r === 17;
  const tag = btn ? 'button' : 'span';
  let attr = btn ? ` type="button" data-id="${id}" aria-pressed="${cls.includes('up')}"` : '';
  if (flashKey && H.isRedA(id)) { const f = flashStyle(flashKey); cls += ' ' + f.cls; attr += f.style; }
  if (c.s === 'J') return `<${tag} class="cd joker ${red ? 'red' : ''} ${cls}"${attr} aria-label="${esc(cardNameL(id))}"><b>${esc(D().jokerFace[c.r - 16])}</b></${tag}>`;
  return `<${tag} class="cd ${red ? 'red' : ''} ${cls}"${attr} aria-label="${esc(cardNameL(id))}"><b>${H.vname(H.val(c.r))}</b><i>${H.SUIT_CH[c.s]}</i></${tag}>`;
}
const mini = (ids, flashKey) => `<div class="mini">${ids.map((i) => cardEl(i, '', false, flashKey)).join('')}</div>`;

function tribPanelHTML(st, me) {

// 进贡阶段我要做什么：{ kind: 'give'|'ret', n } 或 null
function myTribJob(st, me) {

  if (t.step === 'give' && t.givers.includes(me) && !t.gives[me]) return { kind: 'give', n: t.gc };
  if (t.step === 'ret' && st.prev.winners.includes(me) && !t.rets[me]) return { kind: 'ret', n: t.rc };
  return null;
}
function handHTML(st, me) {

  } else if (st.phase === 'play' && g.turn === me) {

    ctrl = `<button class="btn" data-act="play" ${sel.size ? '' : 'disabled'}>${esc(T('play'))}</button>
      <button class="btn sec" data-act="pass" ${g.last ? '' : 'disabled'}>${esc(T('pass'))}</button>${clear}${arrange}<span class="hint">${esc(hint)}</span>`;
  } else if (st.phase === 'tribute') {
    const job = myTribJob(st, me), t = g.trib;
    if (job && job.kind === 'give') ctrl = `<button class="btn" data-act="tribute" ${sel.size === job.n ? '' : 'disabled'}>${esc(T('handIn'))}</button>${clear}<span class="hint">${esc(T(job.n > 1 ? 'giveHint3' : 'giveHint1'))}</span>`;
    else if (job) ctrl = `<button class="btn" data-act="back" ${sel.size === job.n ? '' : 'disabled'}>${esc(T('backBtn'))}</button>${clear}<span class="hint">${esc(T(job.n > 1 ? 'backHint3' : 'backHint1'))}</span>`;
    else if ((t.step === 'pick' || t.step === 'pickRet') && t.pickers.includes(me) && !t.ok[me]) ctrl = `<span class="hint">${esc(T('pickHint'))}</span>`;
    else ctrl = `<span class="hint">${esc(T('waitTrib'))}</span>`;
  } else if (st.phase === 'play') {
    ctrl = `${clear}${arrange}<span class="hint">${esc(g.done.includes(me) ? T('doneWait') : T('notTurn'))}</span>`;
  } else ctrl = arrange;
  const ch = choice ? `<div class="choose"><span class="hint">${esc(T('chooseHint'))}</span>${choice.map((o) => `<button class="btn sec" data-act="playas" data-t="${o.type}">${esc(describeL(o) + ' ' + keyNameL(o))}</button>`).join('')}</div>` : '';
  return `<div class="handwrap"><div class="small">${esc(T('handTitle', { n: hand.length }))}</div><div class="hand">${main.map(ce).join('')}</div>${store}<div class="ctrl">${ctrl}</div>${ch}</div>`;
}

function chatLine(st, m) {
  let text = m.text;
  if (m.kind === 'act') text = T(m.item === 'tomato' ? 'actTomato' : 'actCoffee', { name: m.to != null ? seatName(st, m.to).replace(D().you, '') : '' });
  else if (m.p != null && D().phrases[m.p]) text = D().phrases[m.p];
  if (m.kind === 'stk') { const s = stk(m.text); if (s) return `<li><b>${esc(m.name || seatName(st, m.seat))}</b>${esc(D().sep)}<img class="inl" src="${s.src}" alt="${esc(stkName(s))}"></li>`; }
  return `<li><b>${esc(m.name || seatName(st, m.seat))}</b>${esc(D().sep)}${esc(text)}</li>`;
}
function sideHTML(st, me) {
  const top = Math.max(...st.scores);
  const scores = [0, 1, 2, 3].map((s) => {
    const n = st.scores[s];
    return `<div class="score ${n === top && n > 0 ? 'lead' : ''}"><span class="who">${esc(seatName(st, s))}${st.winner === s && st.phase === 'matchEnd' ? ' 🏆' : ''}<div class="bar"><i style="width:${Math.min(100, (n / H.TARGET) * 100)}%"></i></div></span><span class="pts">${n}</span></div>`;
  }).join('');
  let reset = '';
  if (st.phase !== 'lobby' && st.phase !== 'matchEnd' && me >= 0) {
    const voted = (st.votes || []).includes(uid);
    reset = `<div class="card"><h3>${esc(T('resetTitle'))}</h3><p class="small" style="margin:0 0 10px">${esc(T('resetText', { n: (st.votes || []).length }))}</p>
      <button class="btn sec" data-act="${voted ? 'unvote' : 'vote'}">${esc(voted ? T('unvoteBtn') : T('voteBtn'))}</button></div>`;
  }
  const chat = chats[room].slice(-8).reverse().map((m) => chatLine(st, m)).join('');
  const logs = st.log.slice(-14).reverse().map((m) => `<li>${logHTML(st, m)}</li>`).join('');
  return `<div class="card"><h3>${esc(T('scoresT'))}</h3><p class="small" style="margin:0 0 4px">${esc(T('scoreTo', { n: H.TARGET }))}</p>${scores}</div>${reset}<div class="card"><h3>${esc(T('chat'))}</h3><ul class="log">${chat || `<li class="small">${esc(T('noChat'))}</li>`}</ul></div><div class="card"><h3>${esc(T('logT'))}</h3><ul class="log">${logs || `<li class="small">${esc(T('noLog'))}</li>`}</ul></div>
   <div class="card small">${esc(T('saved'))}</div>`;
}

// ================= 数据读写 =================
async function txWrite(col, r, fn) {
  await runTransaction(db, async (tx) => {
    const ref = doc(db, col, r);
    const snap = await tx.get(ref);
    const v = fn(snap.exists() ? JSON.parse(snap.data().s) : null);
    if (v != null) tx.set(ref, { s: JSON.stringify(v) });
  });
}
async function mutate(fn) {
  if (!db || !uid) { toast(T('noDb')); return; }
  try {
    await txWrite('rooms', room, (st0) => {
      const st = st0 || H.fresh(); const v = st.v || 0;
      st._now = Date.now();
      const next = fn(st);
      if (!next) return null;
      delete next._now; next.v = v + 1; return next;
    });
    return true;
  } catch (e) {
    toast(e && e.code === 'permission-denied' ? T('denied') : errText(e));
  }
}
async function chatWrite(r, fn) {
  try { await txWrite('chat', r, (l) => fn(l || [])); }
  catch (e) { toast(e && e.code === 'permission-denied' ? T('chatDenied') : T('chatFail')); }
}
function needNick() { if (!nick.trim()) { toast(T('needNick')); $('#nick').focus(); return false; } return true; }
function withName(s) { s.names = s.names || {}; s.names[uid] = nick.trim(); return s; }

function onState() {
  const st = cur(), me = st.seats.indexOf(uid);
  const hand = st.g && me >= 0 ? st.g.hands[me] : [];
  for (const id of [...sel]) if (!hand.includes(id)) sel.delete(id);
  if (!(st.phase === 'play' && st.g && st.g.turn === me)) choice = null;
  render();
}

// ================= 选牌：点击或按住滑动 =================
let drag = null;
const cardAt = (x, y) => { const el = document.elementFromPoint(x, y); const b = el && el.closest('.handwrap button.cd[data-id]'); return b ? +b.dataset.id : null; };
document.addEventListener('pointerdown', (e) => {
  const b = e.target.closest('.handwrap button.cd[data-id]');
  if (!b || e.button > 0) return;
  e.preventDefault();
  const id = +b.dataset.id;
  drag = { ids: new Set([id]), adding: !sel.has(id) };
  b.classList.add('sweep');
});
document.addEventListener('pointermove', (e) => {
  if (!drag) return;
  const id = cardAt(e.clientX, e.clientY);
  if (id != null && !drag.ids.has(id)) { drag.ids.add(id); const el = document.querySelector(`.handwrap button.cd[data-id="${id}"]`); if (el) el.classList.add('sweep'); }
});
function endDrag() {
  if (!drag) return;
  const d = drag; drag = null;
  const st = cur(), job = myTribJob(st, st.seats.indexOf(uid));
  // 只需要交一张时，选一张就替换掉之前选的
  if (st.phase === 'tribute' && job && job.n === 1) { const id = [...d.ids].pop(); sel = sel.has(id) && d.ids.size === 1 ? new Set() : new Set([id]); }
  else for (const id of d.ids) d.adding ? sel.add(id) : sel.delete(id);
  choice = null;
  render();
}
document.addEventListener('pointerup', endDrag);
document.addEventListener('pointercancel', endDrag);

document.addEventListener('click', async (e) => {
  const cardBtn = e.target.closest('button.cd[data-id]');
  if (cardBtn) {
    if (e.detail === 0) { const id = +cardBtn.dataset.id; sel.has(id) ? sel.delete(id) : sel.add(id); choice = null; render(); }
    return;
  }
  const t = e.target.closest('[data-act]');
  if (!t || t.disabled) return;
  const a = t.dataset.act;
  const st = cur(), me = st.seats.indexOf(uid);
  if (a === 'snd') { opt[t.dataset.k] = !opt[t.dataset.k]; ls.set('gd-snd', opt); lobby.on = undefined; if (!opt.voice && 'speechSynthesis' in window) speechSynthesis.cancel(); render(); return; }
  if (a === 'lang') { lang = lang === 'zh' ? 'en' : 'zh'; ls.set('gd-lang', lang); applyStatic(); render(); return; }
  if (a === 'emo') { sendChat('emo', t.dataset.v); return; }
  if (a === 'stk') { sendChat('stk', t.dataset.v); return; }
  if (a === 'throw') { sendThrow(t.dataset.item, +t.dataset.to); return; }
  if (a === 'say') { sendChat('text', I18N.zh.phrases[+t.dataset.v], +t.dataset.v); return; }
  if (a === 'room') { room = t.dataset.r; history.replaceState(null, '', room === 'h2' ? '#room2' : '#room1'); sel.clear(); choice = null; onState(); return; }
  if (a === 'clear') { sel.clear(); choice = null; render(); return; }
  if (a === 'tostore' || a === 'unstore') {
    const hand = st.g.hands[me];
    let gs = getGroups(hand).map((g) => g.filter((id) => !sel.has(id)));
    if (a === 'tostore') gs.push(H.sortHand([...sel]));
    setGroups(gs); sel.clear(); choice = null; render(); return;
  }
  if (a === 'sit') { if (!needNick()) return; return mutate((s) => withName(H.sit(s, uid, +t.dataset.i))); }
  if (a === 'claim') {
    if (!needNick()) return;
    const i = +t.dataset.i;
    return mutate((s) => {
      if (s.seats.includes(uid)) throw new Error(T('haveSeat'));
      const old = s.seats[i];
      if (!old || ((s.names || {})[old] || '') !== nick.trim()) throw new Error(T('nickMismatch'));
      s.seats[i] = uid; s.votes = (s.votes || []).map((v) => (v === old ? uid : v)); s.ready = (s.ready || []).map((v) => (v === old ? uid : v));
      return withName(s);
    });
  }
  if (a === 'leave') return mutate((s) => H.leave(s, uid));
  if (a === 'pass') { sel.clear(); choice = null; return mutate((s) => H.pass(s, uid)); }
  if (a === 'ready') { if (!needNick()) return; return mutate((s) => withName(H.setReady(s, uid, true, rand))); }
  if (a === 'unready') return mutate((s) => H.setReady(s, uid, false, rand));
  if (a === 'pause') return mutate((s) => H.pause(s, uid));
  if (a === 'resume') return mutate((s) => H.resume(s, uid));
  if (a === 'vote') return mutate((s) => H.vote(s, uid, true));
  if (a === 'unvote') return mutate((s) => H.vote(s, uid, false));
  if (a === 'reset') return mutate((s) => H.vote(s, uid, true));
  if (a === 'tribute') { const ids = [...sel]; if (await mutate((s) => H.giveTribute(s, uid, ids))) { sel.clear(); render(); } return; }
  if (a === 'back') { const ids = [...sel]; if (await mutate((s) => H.giveBack(s, uid, ids))) { sel.clear(); render(); } return; }
  if (a === 'want') { const id = +t.dataset.v; return mutate((s) => H.wantCard(s, uid, id, false)); }
  if (a === 'wantok') return mutate((s) => H.wantCard(s, uid, null, true));
  if (a === 'play' || a === 'playas') {
    const ids = [...sel];
    let type = null;
    if (a === 'play') {
      const opts = H.options(st, ids);
      if (!opts.length) { toast(D().err[st.g.last ? 'cantBeat' : 'invalidType']); return; }
      if (opts.length > 1) { choice = opts; render(); return; }
      type = opts[0].type;
    } else type = t.dataset.t;
    if (await mutate((s) => H.play(s, uid, ids, type))) { sel.clear(); choice = null; render(); }
  }
});

applyStatic();
$('#nick').value = nick;
$('#nick').addEventListener('input', (e) => { nick = e.target.value; ls.set('gd-nick', nick); });
renderSnd();
(async () => {
  if (!firebaseConfig.projectId) { fatal = { k: 'noConfig' }; render(); return; }
  const timer = setTimeout(() => { if (!ready) { fatal = { k: 'noConn' }; render(); } }, 12000);
  try {
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    db = getFirestore(app);
    onAuthStateChanged(auth, (u) => {
      if (!u || uid) return;
      uid = u.uid;
      buildChat();
      for (const r of ROOMS) {
        onSnapshot(doc(db, 'chat', r), (snap) => onChat(r, snap.exists() ? JSON.parse(snap.data().s) : []), () => {});
        onSnapshot(doc(db, 'rooms', r), (snap) => {
          clearTimeout(timer);
          ready = true; fatal = null;
          states[r] = snap.exists() ? JSON.parse(snap.data().s) : null;
          if (states[r]) handleEvent(r, states[r]); else evSeen[r] = 0;
          onState();
        }, (e) => { clearTimeout(timer); fatal = { k: 'readFail', p: { c: e.code } }; render(); });
      }
    });
    await signInAnonymously(auth);
  } catch (e) { clearTimeout(timer); fatal = { k: 'fbFail', p: { c: e.code || e.message } }; render(); }
})();
}
</script>
</body>
