<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>掼蛋 · 好友联机</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&family=Noto+Serif+SC:wght@700;900&display=swap" rel="stylesheet">
<style>
/* VOICE: 牌桌上的热闹，但规则清楚、不花哨
   IDEA: 一张真实的牌桌——绿呢台面、木质桌沿、纸牌
   PICTURE: 牌桌本身：四个座位围着中间的出牌区，出的牌落在桌子中央
   COLOUR and TYPE: 墨绿呢面 + 木色桌沿 + 朱红牌面与金色万能牌；Noto Serif SC 标题，Noto Sans SC 正文
   LAYOUT: 顶部昵称与声音开关，中间牌桌，下方手牌与存储区，右侧级数、聊天和记录 */
:root{color-scheme:light dark;--bg:light-dark(#ebe4d3,#07160f);--ink:light-dark(#1d2a22,#e9efe9);--sub:light-dark(#5b6b60,#9fb2a6);--panel:light-dark(#fffaf0,#0f2419);--line:light-dark(#d6ccb5,#24412f);--felt:#13603b;--felt2:#0b3f26;--wood:#6b4423;--gold:#e8b43a;--red:#c8102e;--a:#e8b43a;--b:#6fc3ff}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Noto Sans SC",system-ui,sans-serif;overflow-x:clip}
button{font:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
header{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;padding:14px max(4vw,14px)}
h1{font:900 34px/1.05 "Noto Serif SC",serif;margin:0;letter-spacing:.04em}
h1 small{font:500 14px "Noto Sans SC",sans-serif;color:var(--sub);margin-left:8px;letter-spacing:0}
.tabs{display:flex;gap:8px;margin-left:auto}
.tab{min-height:44px;padding:6px 16px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font-weight:700}
.tab[aria-pressed=true]{background:var(--felt);color:#fff;border-color:var(--felt)}
.tab span{font-weight:400;font-size:13px;opacity:.8;margin-left:6px}
.nickbar{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;padding:0 max(4vw,14px) 14px;max-width:1320px;margin:0 auto}
.nickbar label{font-weight:700}
.nickbar input{font:inherit;font-size:16px;min-height:44px;padding:6px 12px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--ink);width:170px}
.snd{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap}
.snd button{min-height:40px;padding:4px 12px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--sub);font-size:14px}
.snd button[aria-pressed=true]{background:var(--felt);border-color:var(--felt);color:#fff}
main{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:18px;padding:0 max(4vw,14px) 28px;max-width:1320px;margin:0 auto}
@media(max-width:900px){main{grid-template-columns:minmax(0,1fr)}}
.status{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:baseline;margin-bottom:10px;font-size:15px}
.status .lvbig{font:900 30px/1 "Noto Serif SC",serif;color:var(--felt)}
:root[data-theme=dark] .status .lvbig{color:var(--gold)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]) .status .lvbig{color:var(--gold)}}
.status .turnmsg{font-weight:700;margin-left:auto}
.felt{background:radial-gradient(ellipse at 50% 45%,#1c7a4c,var(--felt) 50%,var(--felt2));border:12px solid var(--wood);border-radius:30px;box-shadow:inset 0 0 40px rgba(0,0,0,.45),0 10px 30px rgba(0,0,0,.25);color:#f3f7f2;position:relative}
.table{display:grid;grid-template-columns:150px minmax(0,1fr) 150px;grid-template-rows:auto minmax(330px,1fr) auto;grid-template-areas:". top ." "left mid right" ". bot .";gap:10px;padding:14px}
.pl{position:relative;border-radius:14px;padding:8px 10px;background:rgba(0,0,0,.2);border:2px solid transparent;display:flex;flex-direction:column;gap:3px;align-items:center;text-align:center;align-self:center;justify-self:center;width:100%;max-width:240px}
.pl.turn{border-color:var(--gold);box-shadow:0 0 18px rgba(232,180,58,.55)}
.pos-top{grid-area:top}.pos-left{grid-area:left}.pos-right{grid-area:right}.pos-bot{grid-area:bot}
.nm{font-weight:700;font-size:15px;display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:center}
.tg{font-size:12px;font-weight:700;padding:1px 7px;border-radius:6px;color:#10231a}
.tg.t0{background:var(--a)}.tg.t1{background:var(--b)}
.meta{font-size:13px;color:#cfe3d6}
.meta .warn{color:#ffd36b;font-weight:700}
.badge{background:var(--gold);color:#3a2600;font-weight:900;font-size:13px;padding:1px 8px;border-radius:6px}
.mid{grid-area:mid;position:relative;min-height:330px}
.slot{position:absolute;display:flex;flex-direction:column;align-items:center;gap:3px}
.slot.old{opacity:.4}
.s-top{top:4px;left:50%;transform:translateX(-50%)}
.s-bot{bottom:4px;left:50%;transform:translateX(-50%)}
.s-left{left:4px;top:50%;transform:translateY(-50%)}
.s-right{right:4px;top:50%;transform:translateY(-50%);align-items:center}
.slot small{font-size:13px;font-weight:700;color:#fff;background:rgba(0,0,0,.3);padding:0 8px;border-radius:6px}
.ps{font-weight:900;color:#e2efe6;font-size:18px;padding:12px 14px;border-radius:12px;background:rgba(0,0,0,.18)}
.think{font-size:14px;color:#d8e8dd;padding:14px}
.center{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;pointer-events:none}
.center .lv{font:900 40px/1 "Noto Serif SC",serif;color:rgba(232,180,58,.35)}
.panel{position:absolute;inset:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;background:rgba(6,30,18,.72);border-radius:18px;padding:12px;z-index:4}
.panel .lv{font:900 40px/1 "Noto Serif SC",serif;color:var(--gold)}
.lvl{font-size:13px;color:#cfe3d6}
.big{font-weight:700;font-size:17px}
.btn{min-height:44px;padding:8px 20px;border-radius:12px;border:0;font-weight:700;background:var(--gold);color:#2c1d00}
.btn.sec{background:var(--panel);color:var(--ink);border:1px solid var(--line)}
.btn.ghost{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.3)}
.btn.small{min-height:34px;padding:3px 12px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.cd{width:52px;height:76px;border-radius:7px;background:#fffdf7;color:#1c1c1c;border:1px solid #c9bea5;box-shadow:0 2px 4px rgba(0,0,0,.3);position:relative;display:inline-flex;flex-direction:column;align-items:flex-start;padding:3px 5px;margin-left:-26px;line-height:1;flex:none;transition:transform .12s;user-select:none;-webkit-user-select:none}
.cd b{font-size:18px;font-weight:900}.cd i{font-style:normal;font-size:19px;margin-top:2px}
.cd.red{color:var(--red)}
.cd.joker b{font-size:14px;line-height:1.05;writing-mode:vertical-rl}
.cd.wild{background:#fff3cc;border:2px solid var(--gold)}
.cd em{position:absolute;right:3px;bottom:3px;font-style:normal;font-size:11px;font-weight:900;background:var(--gold);color:#3a2600;border-radius:4px;padding:1px 3px}
.cd u{position:absolute;right:4px;top:3px;text-decoration:none;color:#b8860b;font-size:13px}
.cd.up{transform:translateY(-16px);box-shadow:0 6px 12px rgba(0,0,0,.35)}
.cd.sweep{filter:brightness(.82);outline:2px solid #3b82f6;outline-offset:-2px}
button.cd{cursor:pointer;font:inherit}
.mini{display:flex;padding-left:22px}
.mini .cd{width:40px;height:58px;margin-left:-22px;padding:2px 4px;border-radius:6px}
.mini .cd b{font-size:15px}.mini .cd i{font-size:15px}.mini .cd em,.mini .cd u{display:none}.mini .cd.joker b{font-size:12px}
.handwrap{margin-top:14px;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:16px 16px 14px}
.hand{display:flex;flex-wrap:wrap;row-gap:10px;padding:18px 0 4px 26px;min-height:96px;touch-action:none}
.store{display:flex;flex-wrap:wrap;gap:10px 18px;margin-top:8px;padding-top:10px;border-top:1px dashed var(--line);align-items:flex-end}
.store .lab{font-size:13px;font-weight:700;color:var(--sub);align-self:center}
.grp{display:flex;padding:18px 8px 6px 34px;border-radius:12px;background:light-dark(#efe6cf,#173626);touch-action:none}
.ctrl{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:12px}
.ctrl .hint{color:var(--sub);font-size:14px}
.choose{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;align-items:center}
aside{display:flex;flex-direction:column;gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:14px 16px}
.card h3{margin:0 0 8px;font:700 17px/1.2 "Noto Serif SC",serif}
.team{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.team:first-of-type{border-top:0}
.team .lvn{font:900 30px/1 "Noto Serif SC",serif;margin-left:auto}
.team .who{font-size:13px;color:var(--sub)}
.log{list-style:none;margin:0;padding:0;font-size:14px;max-height:280px;overflow:auto}
.log li{padding:4px 0;border-top:1px dashed var(--line)}
.log li:first-child{border-top:0}
.lobby{padding:22px;min-height:440px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-areas:". s2 ." "s3 info s1" ". s0 .";gap:12px;align-items:center}
.seat{min-height:96px;border-radius:16px;border:2px dashed rgba(255,255,255,.45);background:rgba(0,0,0,.18);color:#fff;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:8px}
.seat.taken{border-style:solid}
.seat.t0.taken{border-color:var(--a)}.seat.t1.taken{border-color:var(--b)}
.seat.me{box-shadow:0 0 0 3px #fff inset}
.seat small{font-weight:400;font-size:13px;opacity:.85}
.info{grid-area:info;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}
.info p{margin:0;font-size:14px;color:#d8e8dd}
.info .lv{font:900 34px/1 "Noto Serif SC",serif;color:var(--gold)}
.note{padding:10px 14px;border-radius:12px;background:var(--panel);border:1px solid var(--line);margin-bottom:12px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#1d2a22;color:#fff;padding:10px 18px;border-radius:12px;font-weight:500;box-shadow:0 8px 24px rgba(0,0,0,.35);z-index:9;max-width:90vw}
.res{list-style:none;padding:0;margin:0;font-size:15px}
.small{font-size:13px;color:var(--sub)}
.bubble{position:absolute;left:50%;top:-12px;transform:translate(-50%,-100%);z-index:6;background:#fffdf7;color:#1d2a22;font-weight:700;font-size:15px;padding:8px 12px;border-radius:14px;box-shadow:0 6px 16px rgba(0,0,0,.35);max-width:220px;width:max-content;animation:pop .25s ease-out}
.bubble::after{content:"";position:absolute;left:50%;bottom:-7px;margin-left:-7px;border:7px solid transparent;border-bottom:0;border-top-color:#fffdf7}
.bubble.emo{font-size:44px;line-height:1;padding:6px 10px}
.pos-top .bubble{top:auto;bottom:-12px;transform:translate(-50%,100%);animation:none}
.pos-top .bubble::after{bottom:auto;top:-7px;border-top:0;border-bottom:7px solid #fffdf7}
@keyframes pop{from{transform:translate(-50%,-100%) scale(.6);opacity:0}}
#chatpanel h4{margin:0 0 8px;font:700 15px/1.2 "Noto Serif SC",serif}
.emos,.says{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.emos button{font-size:26px;width:48px;height:48px;border-radius:12px;border:1px solid var(--line);background:var(--bg)}
.says button{min-height:40px;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:14px}
.chatin{display:flex;gap:8px}.chatin input{flex:1;font:inherit;font-size:16px;min-height:44px;padding:6px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
@media(max-width:600px){
 h1{font-size:28px}.tabs{margin-left:0}.snd{margin-left:0}
 .felt{border-width:8px;border-radius:22px}
 .table{grid-template-columns:64px minmax(0,1fr) 64px;grid-template-rows:auto minmax(360px,1fr) auto;grid-template-areas:"top top top" "left mid right" "bot bot bot";padding:8px;gap:6px}
 .pos-left .nm,.pos-right .nm{font-size:13px}
 .pl{padding:6px 4px}
 .s-left{top:92px;transform:none}.s-right{top:auto;bottom:92px;transform:none}
 .mini{padding-left:18px}.mini .cd{width:32px;height:46px;margin-left:-18px}.mini .cd b,.mini .cd i{font-size:12px}
 .cd{width:42px;height:62px;margin-left:-22px}.cd b{font-size:15px}.cd i{font-size:15px}
 .hand{padding-left:22px}.grp{padding-left:30px}
 .lobby{grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-areas:"info info" "s0 s1" "s2 s3";padding:14px}
 .center .lv{display:none}
 .status .turnmsg{margin-left:0;width:100%}
}
@media(prefers-reduced-motion:reduce){.cd{transition:none}.bubble{animation:none}}
</style>
</head>
<body>
<header>
  <h1>掼蛋<small>好友联机 · 我们的规则</small></h1>
  <nav class="tabs">
    <button class="tab" data-act="room" data-r="r1" aria-pressed="true">1号房间<span id="c1"></span></button>
    <button class="tab" data-act="room" data-r="r2" aria-pressed="false">2号房间<span id="c2"></span></button>
  </nav>
</header>
<div class="nickbar">
  <label for="nick">你的昵称</label><input id="nick" maxlength="12" placeholder="例如：James" autocomplete="nickname">
  <span class="small">入座前先填好</span>
  <div class="snd">
    <button type="button" data-act="snd" data-k="music" aria-pressed="true">背景音乐</button>
    <button type="button" data-act="snd" data-k="sfx" aria-pressed="true">音效</button>
    <button type="button" data-act="snd" data-k="voice" aria-pressed="true">语音报牌</button>
  </div>
</div>
<main>
  <section><div id="stage"><div class="note">正在连接牌桌…</div></div><div id="chatpanel" class="handwrap" hidden></div></section>
  <aside id="side"></aside>
</main>
<div class="toast" id="toast" hidden></div>
<script>
const G = (() => {
  const SUITS = ['S', 'H', 'C', 'D'];
  const SUIT_CH = { S: '♠', H: '♥', C: '♣', D: '♦', J: '' };
  const MARKED = 14; // 第一副牌的红桃3，带★，只用于决定第一局先手
  const POS = ['头游', '二游', '三游', '末游'];
  const TEAM = ['A队', 'B队'];
  const RN = { 11: 'J', 12: 'Q', 13: 'K', 14: 'A', 16: '小王', 17: '大王' };

  const E = (m) => new Error(m);
  function card(id) {
    const d = Math.floor(id / 54), i = id % 54;
    if (i === 52) return { id, d, r: 16, s: 'J' };
    if (i === 53) return { id, d, r: 17, s: 'J' };
    return { id, d, s: SUITS[Math.floor(i / 13)], r: (i % 13) + 2 };
  }
  const isWild = (c, L) => c.r === L && (c.s === 'H' || c.s === 'D');
  const val = (r, L) => (r >= 16 ? r : r === L ? 15 : r);
  const team = (s) => s % 2;
  const partner = (s) => (s + 2) % 4;
  const rname = (r) => (r <= 10 ? String(r) : RN[r]);
  const cardName = (id) => { const c = card(id); return c.s === 'J' ? RN[c.r] : SUIT_CH[c.s] + rname(c.r); };

  function sortHand(ids, L) {
    return ids.slice().sort((a, b) => {
      const x = card(a), y = card(b);
      const vx = val(x.r, L), vy = val(y.r, L);
      if (vx !== vy) return vy - vx;
      return SUITS.indexOf(x.s) - SUITS.indexOf(y.s) || a - b;
    });
  }

  // 识别一手牌所有可能的牌型（每种牌型只保留最大的解释）
  function analyze(ids, L) {
    const n = ids.length;
    if (!n) return [];
    const out = {};
    const add = (type, key, bomb) => {
      const o = out[type];
      if (!o || key > o.key) out[type] = { type, key, n, bomb: bomb || 0 };
    };
    let w = 0;
    const jok = [], norm = [];
    for (const c of ids.map(card)) {
      if (isWild(c, L)) w++;
      else if (c.r >= 16) jok.push(c);
      else norm.push(c);
    }
    const cnt = {};
    for (const c of norm) cnt[c.r] = (cnt[c.r] || 0) + 1;
    const ranks = Object.keys(cnt).map(Number);

    if (n === 4 && jok.length === 4) add('kings', 0, 10000);
    if (!jok.length && ranks.length <= 1) {
      const k = ranks.length ? val(ranks[0], L) : 15;
      if (n === 1) add('single', k);
      else if (n === 2) add('pair', k);
      else if (n === 3) add('triple', k);
      else add('bomb', k, (n <= 5 ? (n - 3) * 100 : (n - 2) * 100) + k);
    }
    if (n === 1 && jok.length === 1) add('single', jok[0].r);
    if (n === 2 && jok.length === 2 && jok[0].r === jok[1].r) add('pair', jok[0].r);
    if (n === 5) {
      const jp = jok.length === 2 && jok[0].r === jok[1].r;
      if (!jok.length || jp) {
        for (let T = 2; T <= 14; T++) {
          const cT = cnt[T] || 0;
          if (cT > 3) continue;
          if (jp) { if (norm.length === cT && 3 - cT === w) add('full', val(T, L)); continue; }
          for (let P = 2; P <= 14; P++) {
            if (P === T) continue;
            const cP = cnt[P] || 0;
            if (cP > 2 || cT + cP !== norm.length || 5 - cT - cP !== w) continue;
            add('full', val(T, L));
          }
        }
      }
    }
    if (!jok.length) {
      const seq = (len, mult) => {
        const tops = [];
        for (let s = 1; s + len - 1 <= 14; s++) {
          let used = 0, ok = true;
          for (let k = 0; k < len; k++) {
            const r = s + k === 1 ? 14 : s + k;
            const c = cnt[r] || 0;
            if (c > mult) { ok = false; break; }
            used += c;
          }
          if (ok && used === norm.length && len * mult - used === w) tops.push(s + len - 1);
        }
        return tops;
      };
      if (n === 5) {
        const flush = norm.length > 0 && norm.every((c) => c.s === norm[0].s);
        for (const t of seq(5, 1)) {
          add('straight', t);
          if (flush) add('sf', t, 300 + t);
        }
      }
      if (n === 6) {
        for (const t of seq(3, 2)) add('tube', t);
        for (const t of seq(2, 3)) add('plate', t);
      }
    }
    return Object.values(out);
  }

  // 炸弹大小：4张(1xx) < 5张(2xx) < 同花顺/顶同(3xx) < 6张(4xx) < 7张(5xx) < 8张(6xx) < 四王(10000)
  function beats(p, q) {
    if (!q) return true;
    if (p.bomb) return q.bomb ? p.bomb > q.bomb : true;
    if (q.bomb) return false;
    return p.type === q.type && p.n === q.n && p.key > q.key;
  }

  const TYPE_NAME = { single: '单张', pair: '对子', triple: '三张', full: '三带二', straight: '顺子', tube: '三连对', plate: '钢板', kings: '四王炸' };
  function describe(p) {
    if (p.type === 'bomb') return p.n + '张炸';
    if (p.type === 'sf') return p.key === 14 ? '顶同' : '同花顺';
    return TYPE_NAME[p.type];
  }
  function keyName(p, L) {
    if (p.type === 'kings') return '';
    if (['straight', 'tube', 'plate', 'sf'].includes(p.type)) return '到' + rname(p.key);
    return p.key === 15 ? rname(L) : rname(p.key);
  }

  // ---------- 房间状态 ----------
  function fresh() {
    return { v: 0, phase: 'lobby', seats: [null, null, null, null], levels: [2, 2], aFails: [0, 0], round: 0, g: null, prev: null, votes: [], log: [], winner: null };
  }
  function log(st, m) { st.log.push(m); if (st.log.length > 40) st.log.splice(0, st.log.length - 40); }
  const seatOf = (st, uid) => st.seats.indexOf(uid);
  function needSeat(st, uid) { const s = seatOf(st, uid); if (s < 0) throw E('你还没有入座'); return s; }

  function sit(st, uid, i) {
    if (st.phase !== 'lobby') throw E('游戏进行中，不能换座');
    if (st.seats[i] && st.seats[i] !== uid) throw E('这个座位已经有人了');
    const cur = seatOf(st, uid);

function handleEvent(r, st) {
  const ev = st.ev, prevK = evSeen[r];
  evSeen[r] = ev ? ev.k : 0;
  if (prevK === null || !ev || ev.k <= prevK || r !== room) return;
  if (ev.kind === 'pass') { sfx('pass'); say(['不要', '过', '要不起'][ev.k % 3]); }
  else {
    sfx(ev.type === 'bomb' || ev.type === 'sf' || ev.type === 'kings' ? 'bomb' : 'card');
    let text = spokenPlay(ev);
    if (ev.fin >= 0) text += '。' + seatName(st, ev.seat).replace('（你）', '') + '出完了，' + G.POS[ev.fin];
    say(text);
  }
  const me = st.seats.indexOf(uid);
  if (st.phase === 'play' && st.g && st.g.turn === me && me >= 0) setTimeout(() => sfx('turn'), 600);
}
function renderSnd() { document.querySelectorAll('[data-act=snd]').forEach((b) => b.setAttribute('aria-pressed', !!opt[b.dataset.k])); }

// ================= 存储区（只保存在自己的浏览器里） =================
const storeKey = () => { const st = cur(); return `gd-store:${room}:${st.round}:${uid}`; };
function getGroups(hand) {
  const gs = ls.get(storeKey(), []).map((g) => g.filter((id) => hand.includes(id))).filter((g) => g.length);
  return gs;
}
function setGroups(gs) { ls.set(storeKey(), gs.filter((g) => g.length)); }

// ================= 聊天与表情 =================
const EMOTES = ['😂', '👍', '😎', '😭', '😡', '🤔', '🎉', '💣', '🙏', '😴'];
const PHRASES = ['快点出牌呀，等得我都饿了', '这把稳了！', '队友给力！', '我有炸，放心走', '先别炸，留着', '你走，我掩护', '要大牌，别给小的', '我要放大招了', '手气太差了……', '再来一盘！', '配合愉快，谢谢队友'];
const chats = { r1: [], r2: [] }, chatInit = { r1: false, r2: false }, seen = new Set(), bubbles = {};
let lastSend = 0;
function bubbleHTML(s) {
  const b = bubbles[room + ':' + s];
  if (!b || b.until < Date.now()) return '';
  return `<div class="bubble ${b.kind === 'emo' ? 'emo' : ''}">${esc(b.text)}</div>`;
}
function onChat(r, list) {
  let fresh = false;
  for (const m of list) {
    if (seen.has(m.id)) continue;
    seen.add(m.id);
    if (chatInit[r]) { bubbles[r + ':' + m.seat] = { kind: m.kind, text: m.text, until: Date.now() + 4000 }; setTimeout(render, 4100); if (r === room) fresh = true; }
  }
  chatInit[r] = true;
  chats[r] = list;
  if (fresh) sfx('ding');
  render();
}
function buildChat() {
  $('#chatpanel').innerHTML = `<h4>表情和快捷短语</h4>
    <div class="emos">${EMOTES.map((e) => `<button type="button" data-act="emo" data-v="${e}" aria-label="发送表情 ${e}">${e}</button>`).join('')}</div>
    <div class="says">${PHRASES.map((p, i) => `<button type="button" data-act="say" data-v="${i}">${esc(p)}</button>`).join('')}</div>
    <form class="chatin" id="chatform"><input id="chatIn" maxlength="20" placeholder="自己说点什么（最多20字）" autocomplete="off"><button class="btn sec" type="submit">发送</button></form>`;
  $('#chatform').addEventListener('submit', (e) => { e.preventDefault(); const v = $('#chatIn').value.trim(); if (v && sendChat('text', v)) $('#chatIn').value = ''; });
}
function sendChat(kind, text) {
  const me = cur().seats.indexOf(uid);
  if (me < 0) { toast('入座后才能发消息'); return false; }
  if (Date.now() - lastSend < 1500) { toast('发得太快了，歇一下'); return false; }
  lastSend = Date.now();
  const m = { id: Date.now().toString(36) + Math.random().toString(36).slice(2, 7), seat: me, kind, text: String(text).slice(0, 20), name: nick.trim() };
  chatWrite(room, (list) => list.concat([m]).slice(-30));
  return true;
}

// ================= 画面 =================
function cardEl(id, L, cls = '', mark = false, btn = false) {
  const c = G.card(id);
  const red = c.s === 'H' || c.s === 'D' || c.r === 17;
  const tag = btn ? 'button' : 'span';
  const attr = btn ? ` type="button" data-id="${id}" aria-pressed="${cls.includes('up')}"` : '';
  if (c.s === 'J') return `<${tag} class="cd joker ${red ? 'red' : ''} ${cls}"${attr}><b>${c.r === 17 ? '大王' : '小王'}</b></${tag}>`;
  const wild = L && G.isWild(c, L);
  return `<${tag} class="cd ${red ? 'red' : ''} ${wild ? 'wild' : ''} ${cls}"${attr} aria-label="${G.cardName(id)}${wild ? ' 万能牌' : ''}"><b>${G.rname(c.r)}</b><i>${G.SUIT_CH[c.s]}</i>${wild ? '<em>配</em>' : ''}${mark && id === G.MARKED ? '<u>★</u>' : ''}</${tag}>`;
}
const mini = (ids, L, mark) => `<div class="mini">${ids.map((i) => cardEl(i, L, '', mark)).join('')}</div>`;

function render() {
  const st = cur();
  document.querySelectorAll('.tab').forEach((b) => b.setAttribute('aria-pressed', b.dataset.r === room));
  for (const r of ['r1', 'r2']) {
    const s = states[r], n = s ? s.seats.filter(Boolean).length : 0;
    $('#c' + r[1]).textContent = s && s.phase !== 'lobby' ? '对局中' : n + '/4人';
  }
  renderSnd();
  if (fatal) { $('#stage').innerHTML = `<div class="note">${esc(fatal)}</div>`; $('#side').innerHTML = ''; return; }
  if (!ready) return;
  const me = st.seats.indexOf(uid);
  $('#stage').innerHTML = st.phase === 'lobby' ? lobbyHTML(st, me) : gameHTML(st, me);
  $('#side').innerHTML = sideHTML(st, me);
  $('#chatpanel').hidden = me < 0;

}

function gameHTML(st, me) {
  const g = st.g;

function handHTML(st, me) {

    if (give) ctrl = `<button class="btn" data-act="tribute" ${sel.size === 1 ? '' : 'disabled'}>${give.to != null ? '进贡给 ' + esc(seatName(st, give.to)) : '交出进贡牌'}</button><span class="hint">选一张你手里最大的牌（同样大的牌，花色随你挑）</span>`;
    else if (back) ctrl = `<button class="btn" data-act="back" ${sel.size === 1 ? '' : 'disabled'}>还贡给 ${esc(seatName(st, back.from))}</button><span class="hint">选一张10或以下的牌还回去</span>`;

    ctrl = `<button class="btn sec" data-act="clear" ${sel.size ? '' : 'disabled'}>清空选择</button>${arrange}<span class="hint">${g.done.includes(me) ? '你已经出完了，等队友' : '还没轮到你，可以先理牌、选好牌'}</span>`;
  } else ctrl = arrange;

  return `<div class="handwrap"><div class="small">你的手牌（${hand.length} 张）· 点牌或按住滑过多张牌来选中，再点一次取消</div><div class="hand">${main.map(ce).join('')}</div>${store}<div class="ctrl">${ctrl}</div>${ch}</div>`;
}

function sideHTML(st, me) {
  const teams = [0, 1].map((t) => `<div class="team"><span class="tg t${t}">${G.TEAM[t]}</span><span class="who">${esc(seatName(st, t))}<br>${esc(seatName(st, t + 2))}</span><span class="lvn">${G.rname(st.levels[t])}</span></div>
     ${st.levels[t] === 14 && st.aFails[t] ? `<div class="small">打A失败 ${st.aFails[t]}/3 次（满3次掉回2）</div>` : ''}`).join('');

      <button class="btn sec" data-act="${voted ? 'unvote' : 'vote'}">${voted ? '取消我的申请' : '申请重置'}</button></div>`;

   <div class="card small">进度自动保存在房间里。下次用同一个浏览器打开就能接着打。</div>`;

// ================= 数据读写 =================
async function txWrite(col, r, fn) {
  await runTransaction(db, async (tx) => {
    const ref = doc(db, col, r);
    const snap = await tx.get(ref);
    tx.set(ref, { s: JSON.stringify(fn(snap.exists() ? JSON.parse(snap.data().s) : null)) });
  });
}
async function mutate(fn) {
  if (!db || !uid) { toast('还没连上数据库，请稍等'); return; }
  try {
    await txWrite('rooms', room, (st0) => { const st = st0 || G.fresh(); const v = st.v || 0; const next = fn(st); next.v = v + 1; return next; });
    return true;
  } catch (e) {
    toast(e && e.code === 'permission-denied' ? '数据库拒绝写入：请检查 Firestore 规则' : (e && e.message) || '操作失败，请重试');
  }
}
async function chatWrite(r, fn) {
  try { await txWrite('chat', r, (l) => fn(l || [])); }
  catch (e) { toast(e && e.code === 'permission-denied' ? '聊天被数据库拒绝：请检查 Firestore 规则里有没有 chat 那一段' : '消息没发出去，请重试'); }
}
function needNick() { if (!nick.trim()) { toast('请先在上面填写你的昵称'); $('#nick').focus(); return false; } return true; }
function withName(s) { s.names = s.names || {}; s.names[uid] = nick.trim(); return s; }

function onState() {
  const st = cur(), me = st.seats.indexOf(uid);
  const hand = st.g && me >= 0 ? st.g.hands[me] : [];
  for (const id of [...sel]) if (!hand.includes(id)) sel.delete(id);
  if (!(st.phase === 'play' && st.g && st.g.turn === me)) choice = null;
  render();
}

// ================= 选牌：点击或按住滑动 =================
let drag = null;
const cardAt = (x, y) => { const el = document.elementFromPoint(x, y); const b = el && el.closest('.handwrap button.cd[data-id]'); return b ? +b.dataset.id : null; };
document.addEventListener('pointerdown', (e) => {
  const b = e.target.closest('.handwrap button.cd[data-id]');
  if (!b || e.button > 0) return;
  e.preventDefault();
  const id = +b.dataset.id;
  drag = { ids: new Set([id]), adding: !sel.has(id) };
  b.classList.add('sweep');
});
document.addEventListener('pointermove', (e) => {
  if (!drag) return;
  const id = cardAt(e.clientX, e.clientY);
  if (id != null && !drag.ids.has(id)) { drag.ids.add(id); const el = document.querySelector(`.handwrap button.cd[data-id="${id}"]`); if (el) el.classList.add('sweep'); }
});
function endDrag() {
  if (!drag) return;
  const d = drag; drag = null;
  if (cur().phase === 'tribute') { const id = [...d.ids].pop(); sel = sel.has(id) && d.ids.size === 1 ? new Set() : new Set([id]); }
  else for (const id of d.ids) d.adding ? sel.add(id) : sel.delete(id);
  choice = null;
  render();
}
document.addEventListener('pointerup', endDrag);
document.addEventListener('pointercancel', endDrag);

document.addEventListener('click', async (e) => {
  const cardBtn = e.target.closest('button.cd[data-id]');
  if (cardBtn) {
    if (e.detail === 0) { const id = +cardBtn.dataset.id; sel.has(id) ? sel.delete(id) : sel.add(id); choice = null; render(); }
    return;
  }
  const t = e.target.closest('[data-act]');
  if (!t || t.disabled) return;
  const a = t.dataset.act;
  const st = cur(), me = st.seats.indexOf(uid);
  if (a === 'snd') { opt[t.dataset.k] = !opt[t.dataset.k]; ls.set('gd-snd', opt); lobby.on = undefined; if (!opt.voice && 'speechSynthesis' in window) speechSynthesis.cancel(); render(); return; }
  if (a === 'emo') { sendChat('emo', t.dataset.v); return; }
  if (a === 'say') { sendChat('text', PHRASES[+t.dataset.v]); return; }
  if (a === 'room') { room = t.dataset.r; history.replaceState(null, '', room === 'r2' ? '#room2' : '#room1'); sel.clear(); choice = null; onState(); return; }
  if (a === 'clear') { sel.clear(); choice = null; render(); return; }
  if (a === 'tostore' || a === 'unstore') {
    const hand = st.g.hands[me];
    let gs = getGroups(hand).map((g) => g.filter((id) => !sel.has(id)));
    if (a === 'tostore') gs.push(G.sortHand([...sel], st.g.L));
    setGroups(gs); sel.clear(); choice = null; render(); return;
  }
  if (a === 'sit') { if (!needNick()) return; return mutate((s) => withName(G.sit(s, uid, +t.dataset.i))); }
  if (a === 'claim') {
    if (!needNick()) return;
    const i = +t.dataset.i;
    return mutate((s) => {
      if (s.seats.includes(uid)) throw new Error('你已经有座位了');
      const old = s.seats[i];
      if (!old || ((s.names || {})[old] || '') !== nick.trim()) throw new Error('昵称和这个座位不一致，请填和之前完全一样的昵称');
      s.seats[i] = uid; s.votes = (s.votes || []).map((v) => (v === old ? uid : v));
      return withName(s);
    });
  }
  if (a === 'leave') return mutate((s) => G.leave(s, uid));
  if (a === 'start') return mutate((s) => withName(G.start(s, uid, rand)));
  if (a === 'next') return mutate((s) => G.nextRound(s, uid, rand));
  if (a === 'pass') { sel.clear(); choice = null; return mutate((s) => G.pass(s, uid)); }
  if (a === 'vote') return mutate((s) => G.vote(s, uid, true));
  if (a === 'unvote') return mutate((s) => G.vote(s, uid, false));
  if (a === 'reset') return mutate((s) => G.vote(s, uid, true));
  if (a === 'tribute') { const id = [...sel][0]; if (await mutate((s) => G.giveTribute(s, uid, id))) { sel.clear(); render(); } return; }
  if (a === 'back') { const id = [...sel][0]; if (await mutate((s) => G.giveBack(s, uid, id))) { sel.clear(); render(); } return; }
  if (a === 'play' || a === 'playas') {
    const ids = [...sel];
    let type = null;
    if (a === 'play') {
      const opts = G.options(st, ids);
      if (!opts.length) { toast(st.g.last ? '管不上，或者这不是有效的牌型' : '这不是有效的牌型'); return; }
      if (opts.length > 1) { choice = opts; render(); return; }
      type = opts[0].type;
    } else type = t.dataset.t;
    if (await mutate((s) => G.play(s, uid, ids, type))) { sel.clear(); choice = null; render(); }
  }
});

$('#nick').value = nick;
$('#nick').addEventListener('input', (e) => { nick = e.target.value; ls.set('gd-nick', nick); });
renderSnd();
(async () => {
  if (!firebaseConfig.projectId) { fatal = '还没有填入 Firebase 配置：请把配置粘贴到 index.html 里。'; render(); return; }
  const timer = setTimeout(() => { if (!ready) { fatal = '暂时连不上数据库，请检查网络后刷新页面。'; render(); } }, 12000);
  try {
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    db = getFirestore(app);
    onAuthStateChanged(auth, (u) => {
      if (!u || uid) return;
      uid = u.uid;
      buildChat();
      for (const r of ['r1', 'r2']) {
        onSnapshot(doc(db, 'chat', r), (snap) => onChat(r, snap.exists() ? JSON.parse(snap.data().s) : []), () => {});
        onSnapshot(doc(db, 'rooms', r), (snap) => {
          clearTimeout(timer);
          ready = true; fatal = '';
          states[r] = snap.exists() ? JSON.parse(snap.data().s) : null;
          if (states[r]) handleEvent(r, states[r]); else evSeen[r] = 0;
          onState();
        }, (e) => { clearTimeout(timer); fatal = '读取牌桌失败（' + e.code + '）：请检查 Firestore 规则。'; render(); });
      }
    });
    await signInAnonymously(auth);
  } catch (e) { clearTimeout(timer); fatal = '连接 Firebase 失败（' + (e.code || e.message) + '）：请检查配置和匿名登录是否已开启。'; render(); }
})();
}
</script>
