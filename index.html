<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>掼蛋 · 好友联机</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&family=Noto+Serif+SC:wght@700;900&display=swap" rel="stylesheet">
<style>
/* VOICE: 牌桌上的热闹，但规则清楚、不花哨
   IDEA: 一张真实的牌桌——绿呢台面、木质桌沿、纸牌
   PICTURE: 牌桌本身：四个座位围着中间的出牌区，出的牌落在桌子中央
   COLOUR and TYPE: 墨绿呢面 + 木色桌沿 + 朱红牌面与金色万能牌；Noto Serif SC 标题，Noto Sans SC 正文
   LAYOUT: 顶部昵称与声音开关，中间牌桌，下方手牌与存储区，右侧级数、聊天和记录 */
:root{color-scheme:light dark;--bg:light-dark(#ebe4d3,#07160f);--ink:light-dark(#1d2a22,#e9efe9);--sub:light-dark(#5b6b60,#9fb2a6);--panel:light-dark(#fffaf0,#0f2419);--line:light-dark(#d6ccb5,#24412f);--felt:#13603b;--felt2:#0b3f26;--wood:#6b4423;--gold:#e8b43a;--red:#c8102e;--a:#e8b43a;--b:#6fc3ff}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Noto Sans SC",system-ui,sans-serif;overflow-x:clip}
button{font:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
header{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;padding:14px max(4vw,14px)}
h1{font:900 34px/1.05 "Noto Serif SC",serif;margin:0;letter-spacing:.04em}
h1 small{font:500 14px "Noto Sans SC",sans-serif;color:var(--sub);margin-left:8px;letter-spacing:0}
.tabs{display:flex;gap:8px;margin-left:auto}
.tab{min-height:44px;padding:6px 16px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font-weight:700}
.tab[aria-pressed=true]{background:var(--felt);color:#fff;border-color:var(--felt)}
.tab span{font-weight:400;font-size:13px;opacity:.8;margin-left:6px}
.nickbar{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;padding:0 max(4vw,14px) 14px;max-width:1320px;margin:0 auto}
.nickbar label{font-weight:700}
.nickbar input{font:inherit;font-size:16px;min-height:44px;padding:6px 12px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--ink);width:170px}
.snd{display:flex;gap:8px;margin-left:auto;flex-wrap:wrap}
.vol{display:flex;align-items:center;gap:8px;padding:4px 12px 4px 4px;border-radius:999px;border:1px solid var(--line);background:var(--panel)}
.vol button{min-height:36px;padding:2px 12px;border-radius:999px;border:0;background:transparent;color:var(--sub);font-size:14px;white-space:nowrap}
.vol button[aria-pressed=true]{background:var(--felt);color:#fff}
.vol input{width:96px;accent-color:var(--felt);height:28px}
.vol output{font-size:12px;color:var(--sub);width:2.4em;text-align:right;font-variant-numeric:tabular-nums}
.vol.off input,.vol.off output{opacity:.4}
main{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:18px;padding:0 max(4vw,14px) 28px;max-width:1320px;margin:0 auto}
@media(max-width:900px){main{grid-template-columns:minmax(0,1fr)}}
.status{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:baseline;margin-bottom:10px;font-size:15px}
.status .lvbig{font:900 30px/1 "Noto Serif SC",serif;color:var(--felt)}
:root[data-theme=dark] .status .lvbig{color:var(--gold)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]) .status .lvbig{color:var(--gold)}}
.status .turnmsg{font-weight:700;margin-left:auto}
.felt{background:radial-gradient(ellipse at 50% 45%,#1c7a4c,var(--felt) 50%,var(--felt2));border:12px solid var(--wood);border-radius:30px;box-shadow:inset 0 0 40px rgba(0,0,0,.45),0 10px 30px rgba(0,0,0,.25);color:#f3f7f2;position:relative}
.table{display:grid;grid-template-columns:150px minmax(0,1fr) 150px;grid-template-rows:auto minmax(330px,1fr) auto;grid-template-areas:". top ." "left mid right" ". bot .";gap:10px;padding:14px}
.pl{position:relative;border-radius:14px;padding:8px 10px;background:rgba(0,0,0,.2);border:2px solid transparent;display:flex;flex-direction:column;gap:3px;align-items:center;text-align:center;align-self:center;justify-self:center;width:100%;max-width:240px}
.pl.turn{border-color:var(--gold);box-shadow:0 0 18px rgba(232,180,58,.55)}
.pos-top{grid-area:top}.pos-left{grid-area:left}.pos-right{grid-area:right}.pos-bot{grid-area:bot}
.nm{font-weight:700;font-size:15px;display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:center}
.tg{font-size:12px;font-weight:700;padding:1px 7px;border-radius:6px;color:#10231a}
.tg.t0{background:var(--a)}.tg.t1{background:var(--b)}
.meta{font-size:13px;color:#cfe3d6}
.meta .warn{color:#ffd36b;font-weight:700}
.badge{background:var(--gold);color:#3a2600;font-weight:900;font-size:13px;padding:1px 8px;border-radius:6px}
.mid{grid-area:mid;position:relative;min-height:330px}
.slot{position:absolute;display:flex;flex-direction:column;align-items:center;gap:3px}
.slot.old{opacity:.4}
.s-top{top:4px;left:50%;transform:translateX(-50%)}
.s-bot{bottom:4px;left:50%;transform:translateX(-50%)}
.s-left{left:4px;top:50%;transform:translateY(-50%)}
.s-right{right:4px;top:50%;transform:translateY(-50%);align-items:center}
.slot small{font-size:13px;font-weight:700;color:#fff;background:rgba(0,0,0,.3);padding:0 8px;border-radius:6px}
.ps{font-weight:900;color:#e2efe6;font-size:18px;padding:12px 14px;border-radius:12px;background:rgba(0,0,0,.18)}
.think{font-size:14px;color:#d8e8dd;padding:14px}
.center{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;pointer-events:none}
.center .lv{font:900 40px/1 "Noto Serif SC",serif;color:rgba(232,180,58,.35)}
.panel{position:absolute;inset:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;background:rgba(6,30,18,.72);border-radius:18px;padding:12px;z-index:4}
.panel .lv{font:900 40px/1 "Noto Serif SC",serif;color:var(--gold)}
.lvl{font-size:13px;color:#cfe3d6}
.big{font-weight:700;font-size:17px}
.btn{min-height:44px;padding:8px 20px;border-radius:12px;border:0;font-weight:700;background:var(--gold);color:#2c1d00}
.btn.sec{background:var(--panel);color:var(--ink);border:1px solid var(--line)}
.btn.ghost{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.3)}
.btn.small{min-height:34px;padding:3px 12px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.cd{width:52px;height:76px;border-radius:7px;background:#fffdf7;color:#1c1c1c;border:1px solid #c9bea5;box-shadow:0 2px 4px rgba(0,0,0,.3);position:relative;display:inline-flex;flex-direction:column;align-items:flex-start;padding:3px 5px;margin-left:-26px;line-height:1;flex:none;transition:transform .12s;user-select:none;-webkit-user-select:none}
.cd b{font-size:18px;font-weight:900}.cd i{font-style:normal;font-size:19px;margin-top:2px}
.cd.red{color:var(--red)}
.cd.joker b{font-size:14px;line-height:1.05;writing-mode:vertical-rl}
.cd.wild{background:#fff3cc;border:2px solid var(--gold)}
.cd em{position:absolute;right:3px;bottom:3px;font-style:normal;font-size:11px;font-weight:900;background:var(--gold);color:#3a2600;border-radius:4px;padding:1px 3px}
.cd u{position:absolute;right:4px;top:3px;text-decoration:none;color:#b8860b;font-size:13px}
.cd.up{transform:translateY(-16px);box-shadow:0 6px 12px rgba(0,0,0,.35)}
.cd.sweep{filter:brightness(.82);outline:2px solid #3b82f6;outline-offset:-2px}
button.cd{cursor:pointer;font:inherit}
.mini{display:flex;padding-left:22px}
.mini .cd{width:40px;height:58px;margin-left:-22px;padding:2px 4px;border-radius:6px}
.mini .cd b{font-size:15px}.mini .cd i{font-size:15px}.mini .cd em,.mini .cd u{display:none}.mini .cd.joker b{font-size:12px}
.handwrap{margin-top:14px;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:16px 16px 14px}
.hand{display:flex;flex-wrap:wrap;row-gap:10px;padding:18px 0 4px 26px;min-height:96px;touch-action:none}
.store{display:flex;flex-wrap:wrap;gap:10px 18px;margin-top:8px;padding-top:10px;border-top:1px dashed var(--line);align-items:flex-end}
.store .lab{font-size:13px;font-weight:700;color:var(--sub);align-self:center}
.grp{display:flex;padding:18px 8px 6px 34px;border-radius:12px;background:light-dark(#efe6cf,#173626);touch-action:none}
.ctrl{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:12px}
.ctrl .hint{color:var(--sub);font-size:14px}
.choose{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;align-items:center}
aside{display:flex;flex-direction:column;gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:14px 16px}
.card h3{margin:0 0 8px;font:700 17px/1.2 "Noto Serif SC",serif}
.team{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.team:first-of-type{border-top:0}
.team .lvn{font:900 30px/1 "Noto Serif SC",serif;margin-left:auto}
.team .who{font-size:13px;color:var(--sub)}
.log{list-style:none;margin:0;padding:0;font-size:14px;max-height:280px;overflow:auto}
.log li{padding:4px 0;border-top:1px dashed var(--line)}
.log li:first-child{border-top:0}
.lobby{padding:22px;min-height:440px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-areas:". s2 ." "s3 info s1" ". s0 .";gap:12px;align-items:center}
.seat{min-height:96px;border-radius:16px;border:2px dashed rgba(255,255,255,.45);background:rgba(0,0,0,.18);color:#fff;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:8px}
.seat.taken{border-style:solid}
.seat.t0.taken{border-color:var(--a)}.seat.t1.taken{border-color:var(--b)}
.seat.me{box-shadow:0 0 0 3px #fff inset}
.seat small{font-weight:400;font-size:13px;opacity:.85}
.info{grid-area:info;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}
.info p{margin:0;font-size:14px;color:#d8e8dd}
.info .lv{font:900 34px/1 "Noto Serif SC",serif;color:var(--gold)}
.note{padding:10px 14px;border-radius:12px;background:var(--panel);border:1px solid var(--line);margin-bottom:12px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#1d2a22;color:#fff;padding:10px 18px;border-radius:12px;font-weight:500;box-shadow:0 8px 24px rgba(0,0,0,.35);z-index:9;max-width:90vw}
.res{list-style:none;padding:0;margin:0;font-size:15px}
.small{font-size:13px;color:var(--sub)}
.bubble{position:absolute;left:50%;top:-12px;transform:translate(-50%,-100%);z-index:6;background:#fffdf7;color:#1d2a22;font-weight:700;font-size:15px;padding:8px 12px;border-radius:14px;box-shadow:0 6px 16px rgba(0,0,0,.35);max-width:220px;width:max-content;animation:pop .25s ease-out}
.bubble::after{content:"";position:absolute;left:50%;bottom:-7px;margin-left:-7px;border:7px solid transparent;border-bottom:0;border-top-color:#fffdf7}
.bubble.emo{font-size:44px;line-height:1;padding:6px 10px}
.pos-top .bubble{top:auto;bottom:-12px;transform:translate(-50%,100%);animation:none}
.pos-top .bubble::after{bottom:auto;top:-7px;border-top:0;border-bottom:7px solid #fffdf7}
@keyframes pop{from{transform:translate(-50%,-100%) scale(.6);opacity:0}}
#chatpanel h4{margin:0 0 8px;font:700 15px/1.2 "Noto Serif SC",serif}
.emos,.says{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.emos button{font-size:26px;width:48px;height:48px;border-radius:12px;border:1px solid var(--line);background:var(--bg)}
.stks{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.stks button{width:60px;height:60px;border-radius:12px;border:1px solid var(--line);background:var(--bg);padding:4px;display:flex;align-items:center;justify-content:center}
.stks img{max-width:100%;max-height:100%;border-radius:6px}
.bubble.stk{padding:6px;line-height:0}.bubble.stk img{width:84px;height:84px;object-fit:contain;border-radius:8px}
.log img.inl{height:30px;vertical-align:middle;border-radius:4px}
.says button{min-height:40px;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:14px}
.chatin{display:flex;gap:8px}.chatin input{flex:1;font:inherit;font-size:16px;min-height:44px;padding:6px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.acts{display:flex;gap:6px;justify-content:center;margin-top:2px}
.acts button{width:34px;height:34px;border-radius:10px;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.12);font-size:18px;line-height:1;padding:0}
.acts button:hover{background:rgba(255,255,255,.25)}
.fx{position:fixed;left:0;top:0;pointer-events:none;z-index:20;will-change:transform,opacity}
.fx svg{display:block}
.fxlabel{position:fixed;z-index:21;pointer-events:none;background:#fffdf7;color:#5a3317;font-weight:700;font-size:14px;padding:5px 10px;border-radius:10px;box-shadow:0 4px 12px rgba(0,0,0,.3);white-space:nowrap}
@media(max-width:600px){
 .acts button{width:28px;height:28px;font-size:15px}
 h1{font-size:28px}.tabs{margin-left:0}.snd{margin-left:0;width:100%}.vol{flex:1 1 100%}.vol input{flex:1;width:auto}
 .felt{border-width:8px;border-radius:22px}
 .table{grid-template-columns:64px minmax(0,1fr) 64px;grid-template-rows:auto minmax(360px,1fr) auto;grid-template-areas:"top top top" "left mid right" "bot bot bot";padding:8px;gap:6px}
 .pos-left .nm,.pos-right .nm{font-size:13px}
 .pl{padding:6px 4px}
 .s-left{top:92px;transform:none}.s-right{top:auto;bottom:92px;transform:none}
 .mini{padding-left:18px}.mini .cd{width:32px;height:46px;margin-left:-18px}.mini .cd b,.mini .cd i{font-size:12px}
 .cd{width:42px;height:62px;margin-left:-22px}.cd b{font-size:15px}.cd i{font-size:15px}
 .hand{padding-left:22px}.grp{padding-left:30px}
 .lobby{grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-areas:"info info" "s0 s1" "s2 s3";padding:14px}
 .center .lv{display:none}
 .status .turnmsg{margin-left:0;width:100%}
}
@media(prefers-reduced-motion:reduce){.cd{transition:none}.bubble{animation:none}}
</style>
</head>
<body>
<header>
  <h1><span data-i18n="h1">掼蛋</span><small data-i18n="sub">好友联机 · 我们的规则</small></h1>
  <nav class="tabs">
    <button class="tab" data-act="room" data-r="r1" aria-pressed="true"><span data-i18n="room1">1号房间</span><span id="c1"></span></button>
    <button class="tab" data-act="room" data-r="r2" aria-pressed="false"><span data-i18n="room2">2号房间</span><span id="c2"></span></button>
    <button class="tab" data-act="lang" data-i18n="langBtn">English</button>
  </nav>
</header>
<div class="nickbar">
  <label for="nick" data-i18n="nick">你的昵称</label><input id="nick" maxlength="12" placeholder="例如：James" data-i18n-ph="nickPh" autocomplete="nickname">
  <span class="small" data-i18n="nickHint">入座前先填好</span>
  <div class="snd">
    <div class="vol" data-k="music"><button type="button" data-act="snd" data-k="music" aria-pressed="true" data-i18n="music">背景音乐</button><input type="range" min="0" max="100" step="5" data-vol="music" aria-label="背景音乐音量"><output></output></div>
    <div class="vol" data-k="sfx"><button type="button" data-act="snd" data-k="sfx" aria-pressed="true" data-i18n="sfx">音效</button><input type="range" min="0" max="100" step="5" data-vol="sfx" aria-label="音效音量"><output></output></div>
    <div class="vol" data-k="voice"><button type="button" data-act="snd" data-k="voice" aria-pressed="true" data-i18n="voice">语音报牌</button><input type="range" min="0" max="100" step="5" data-vol="voice" aria-label="语音报牌音量"><output></output></div>
  </div>
</div>
<main>
  <section><div id="stage"><div class="note" data-i18n="connecting">正在连接牌桌…</div></div><div id="chatpanel" class="handwrap" hidden></div></section>
  <aside id="side"></aside>
</main>
<div class="toast" id="toast" hidden></div>
<script>
const G = (() => {
  const SUITS = ['S', 'H', 'C', 'D'];
  const SUIT_CH = { S: '♠', H: '♥', C: '♣', D: '♦', J: '' };
  const MARKED = 14; // 第一副牌的红桃3，带★，只用于决定第一局先手
  const POS = ['头游', '二游', '三游', '末游'];
  const TEAM = ['A队', 'B队'];
  const RN = { 11: 'J', 12: 'Q', 13: 'K', 14: 'A', 16: '小王', 17: '大王' };

  const E = (code) => { const e = new Error(code); e.code = code; return e; };
  function card(id) {
    const d = Math.floor(id / 54), i = id % 54;
    if (i === 52) return { id, d, r: 16, s: 'J' };
    if (i === 53) return { id, d, r: 17, s: 'J' };
    return { id, d, s: SUITS[Math.floor(i / 13)], r: (i % 13) + 2 };
  }
  const isWild = (c, L) => c.r === L && (c.s === 'H' || c.s === 'D');
  const val = (r, L) => (r >= 16 ? r : r === L ? 15 : r);
  const team = (s) => s % 2;
  const partner = (s) => (s + 2) % 4;
  const rname = (r) => (r <= 10 ? String(r) : RN[r]);
  const cardName = (id) => { const c = card(id); return c.s === 'J' ? RN[c.r] : SUIT_CH[c.s] + rname(c.r); };

  function sortHand(ids, L) {
    return ids.slice().sort((a, b) => {
      const x = card(a), y = card(b);
      const vx = val(x.r, L), vy = val(y.r, L);
      if (vx !== vy) return vy - vx;
      return SUITS.indexOf(x.s) - SUITS.indexOf(y.s) || a - b;
    });
  }

  // 识别一手牌所有可能的牌型（每种牌型只保留最大的解释）
  function analyze(ids, L) {
    const n = ids.length;
    if (!n) return [];
    const out = {};
    const add = (type, key, bomb) => {
      const o = out[type];
      if (!o || key > o.key) out[type] = { type, key, n, bomb: bomb || 0 };
    };
    let w = 0;
    const jok = [], norm = [];
    for (const c of ids.map(card)) {
      if (isWild(c, L)) w++;
      else if (c.r >= 16) jok.push(c);
      else norm.push(c);
    }
    const cnt = {};
    for (const c of norm) cnt[c.r] = (cnt[c.r] || 0) + 1;
    const ranks = Object.keys(cnt).map(Number);

    if (n === 4 && jok.length === 4) add('kings', 0, 10000);
    if (!jok.length && ranks.length <= 1) {
      const k = ranks.length ? val(ranks[0], L) : 15;
      if (n === 1) add('single', k);
      else if (n === 2) add('pair', k);
      else if (n === 3) add('triple', k);
      else add('bomb', k, (n <= 5 ? (n - 3) * 100 : (n - 2) * 100) + k);
    }
    if (n === 1 && jok.length === 1) add('single', jok[0].r);
    if (n === 2 && jok.length === 2 && jok[0].r === jok[1].r) add('pair', jok[0].r);
    if (n === 5) {
      const jp = jok.length === 2 && jok[0].r === jok[1].r;
      if (!jok.length || jp) {
        for (let T = 2; T <= 14; T++) {
          const cT = cnt[T] || 0;
          if (cT > 3) continue;
          if (jp) { if (norm.length === cT && 3 - cT === w) add('full', val(T, L)); continue; }
          for (let P = 2; P <= 14; P++) {
            if (P === T) continue;
            const cP = cnt[P] || 0;
            if (cP > 2 || cT + cP !== norm.length || 5 - cT - cP !== w) continue;
            add('full', val(T, L));
          }
        }
      }
    }
    if (!jok.length) {
      const seq = (len, mult) => {
        const tops = [];
        for (let s = 1; s + len - 1 <= 14; s++) {
          let used = 0, ok = true;
          for (let k = 0; k < len; k++) {
            const r = s + k === 1 ? 14 : s + k;
            const c = cnt[r] || 0;

    let text = spokenPlay(ev);
    if (ev.fin >= 0) text += '。' + (rawName(st, ev.seat) || '玩家') + '出完了，' + G.POS[ev.fin];
    say(text);
  }
  const me = st.seats.indexOf(uid);
  if (st.phase === 'play' && st.g && st.g.turn === me && me >= 0) setTimeout(() => sfx('turn'), 600);
}
function renderSnd() {
  document.querySelectorAll('.vol').forEach((w) => {
    const k = w.dataset.k;
    w.querySelector('button').setAttribute('aria-pressed', !!opt[k]);
    w.classList.toggle('off', !opt[k]);
    const r = w.querySelector('input');
    if (document.activeElement !== r) r.value = vol[k];
    w.querySelector('output').textContent = vol[k] + '%';
  });
}
function applyVol() {
  if (AU.ctx) {
    AU.music.gain.setTargetAtTime(MAXV.music * vol.music / 100, AU.ctx.currentTime, 0.05);
    AU.sfx.gain.setTargetAtTime(MAXV.sfx * vol.sfx / 100, AU.ctx.currentTime, 0.05);
  }
  if (lobby.el && lobby.on && !lobby.el.paused) { clearInterval(lobby.fade); lobby.el.volume = Math.min(1, lobbyVol()); }
}
document.addEventListener('input', (e) => {
  const k = e.target.dataset && e.target.dataset.vol;
  if (!k) return;
  vol[k] = +e.target.value;
  if (!opt[k] && vol[k] > 0) { opt[k] = true; ls.set('gd-snd', opt); lobby.on = undefined; syncMusic(); }
  ls.set('gd-vol', vol);
  applyVol(); renderSnd();
});
document.addEventListener('change', (e) => {
  const k = e.target.dataset && e.target.dataset.vol;
  if (k === 'sfx') sfx('card');
  if (k === 'voice') say('三个4带一对2');
});

const storeKey = () => { const st = cur(); return `gd-store:${room}:${st.round}:${uid}`; };
function getGroups(hand) {
  const gs = ls.get(storeKey(), []).map((g) => g.filter((id) => hand.includes(id))).filter((g) => g.length);
  return gs;
}
function setGroups(gs) { ls.set(storeKey(), gs.filter((g) => g.length)); }

const stk = (id) => STICKERS.find((s) => s.id === id);
const stkName = (s) => (lang === 'zh' ? s.zh : s.en);
const EMOTES = ['😂', '👍', '😎', '😭', '😡', '🤔', '🎉', '💣', '🙏', '😴'];
const chats = { r1: [], r2: [] }, chatInit = { r1: false, r2: false }, seen = new Set(), bubbles = {};
let lastSend = 0;
function bubbleHTML(s) {
  const b = bubbles[room + ':' + s];
  if (!b || b.until < Date.now()) return '';
  if (b.kind === 'stk') { const s = stk(b.text); return s ? `<div class="bubble stk"><img src="${s.src}" alt="${esc(stkName(s))}"></div>` : ''; }
  const text = b.p != null && D().phrases[b.p] ? D().phrases[b.p] : b.text;
  return `<div class="bubble ${b.kind === 'emo' ? 'emo' : ''}">${esc(text)}</div>`;
}
function onChat(r, list) {
  let fresh = false;
  for (const m of list) {
    if (seen.has(m.id)) continue;
    seen.add(m.id);
    if (!chatInit[r]) continue;
    if (m.kind === 'act') { if (r === room) setTimeout(() => throwFx(m.item, m.seat, m.to), 0); continue; }
    bubbles[r + ':' + m.seat] = { kind: m.kind, text: m.text, p: m.p, until: Date.now() + 4000 }; setTimeout(render, 4100); if (r === room) fresh = true;
  }
  chatInit[r] = true;
  chats[r] = list;
  if (fresh) sfx('ding');
  render();
}
function buildChat() {
  const keep = $('#chatIn') ? $('#chatIn').value : '';
  $('#chatpanel').innerHTML = `<h4>${esc(T('emoTitle'))}</h4>
    <div class="emos">${EMOTES.map((e) => `<button type="button" data-act="emo" data-v="${e}" aria-label="${esc(T('emoAria', { e }))}">${e}</button>`).join('')}</div>
    <div class="stks">${STICKERS.map((s) => `<button type="button" data-act="stk" data-v="${s.id}" aria-label="${esc(T('emoAria', { e: stkName(s) }))}" title="${esc(stkName(s))}"><img src="${s.src}" alt=""></button>`).join('')}</div>
    <div class="says">${D().phrases.map((p, i) => `<button type="button" data-act="say" data-v="${i}">${esc(p)}</button>`).join('')}</div>
    <form class="chatin" id="chatform"><input id="chatIn" maxlength="20" placeholder="${esc(T('chatPh'))}" autocomplete="off" value="${esc(keep)}"><button class="btn sec" type="submit">${esc(T('send'))}</button></form>`;
  $('#chatform').addEventListener('submit', (e) => { e.preventDefault(); const v = $('#chatIn').value.trim(); if (v && sendChat('text', v)) $('#chatIn').value = ''; });
}
function sendChat(kind, text, p) {
  const me = cur().seats.indexOf(uid);
  if (me < 0) { toast(T('seatFirst')); return false; }
  if (Date.now() - lastSend < 1000) { toast(T('tooFast')); return false; }
  lastSend = Date.now();
  const m = { id: Date.now().toString(36) + Math.random().toString(36).slice(2, 7), seat: me, kind, text: String(text).slice(0, 20), name: nick.trim() };
  if (p != null) m.p = p;
  chatWrite(room, (list) => list.concat([m]).slice(-30));
  return true;
}

const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
function sendThrow(item, to) {
  const st = cur(), me = st.seats.indexOf(uid);
  if (me < 0 || to === me) return;
  if (Date.now() - lastSend < 1000) { toast(T('tooFast')); return; }
  lastSend = Date.now();
  const who = rawName(st, to) || '玩家';
  const text = item === 'tomato' ? `向 ${who} 扔了一个番茄` : `给 ${who} 倒了一杯卡布奇诺`;
  const m = { id: Date.now().toString(36) + Math.random().toString(36).slice(2, 7), seat: me, to, kind: 'act', item, text, name: nick.trim() };
  chatWrite(room, (list) => list.concat([m]).slice(-30));
}
function seatBox(s) { const el = document.querySelector(`.pl[data-seat="${s}"]`); return el ? el.getBoundingClientRect() : null; }
function fxEl(html, x, y) {
  const el = document.createElement('div'); el.className = 'fx'; el.innerHTML = html;
  el.style.transform = `translate(${x}px,${y}px)`; document.body.appendChild(el); return el;
}
function arc(x0, y0, x1, y1, h, n, extra) {
  const k = [];
  for (let i = 0; i <= n; i++) { const t = i / n; k.push({ transform: `translate(${x0 + (x1 - x0) * t}px,${y0 + (y1 - y0) * t - h * 4 * t * (1 - t)}px) ${extra(t)}` }); }
  return k;
}
function throwFx(item, from, to) {
  const rb = seatBox(to);
  if (!rb) return;
  const ra = seatBox(from) || { left: innerWidth / 2, top: innerHeight, width: 0, height: 0 };
  const x0 = ra.left + ra.width / 2, y0 = ra.top + ra.height / 2, x1 = rb.left + rb.width / 2, y1 = rb.top + rb.height / 2;
  const h = Math.min(160, 60 + Math.hypot(x1 - x0, y1 - y0) * 0.3);
  if (item === 'tomato') {
    sfx('whoosh');
    const el = fxEl(SVG.tomato, x0 - 22, y0 - 22);
    const fly = el.animate(arc(x0 - 22, y0 - 22, x1 - 22, y1 - 22, h, 12, (t) => `rotate(${t * 720}deg)`), { duration: reduceMotion ? 1 : 620, easing: 'linear', fill: 'forwards' });
    fly.onfinish = () => {
      el.remove(); sfx('splat');
      const sp = fxEl(SVG.splat, x1 - 60, y1 - 60);
      sp.animate([{ transform: `translate(${x1 - 60}px,${y1 - 60}px) scale(.2)`, opacity: 1 }, { transform: `translate(${x1 - 60}px,${y1 - 60}px) scale(1.1)`, opacity: 1, offset: 0.06 }, { transform: `translate(${x1 - 60}px,${y1 - 60}px) scale(1)`, opacity: 1, offset: 0.12 }, { transform: `translate(${x1 - 60}px,${y1 - 52}px) scale(1)`, opacity: 1, offset: 0.65 }, { transform: `translate(${x1 - 60}px,${y1 - 40}px) scale(1)`, opacity: 0 }], { duration: 3400, easing: 'ease-in', fill: 'forwards' }).onfinish = () => sp.remove();
      shake(to);
    };
  } else {
    sfx('clink');
    const tx = x1 - 32 - 28, ty = y1 - 26 - 70;
    const el = fxEl(SVG.cup, x0 - 32, y0 - 26);
    const fly = el.animate(arc(x0 - 32, y0 - 26, tx, ty, h * 0.6, 12, () => 'rotate(0deg)'), { duration: reduceMotion ? 1 : 700, easing: 'ease-out', fill: 'forwards' });
    fly.onfinish = () => {
      el.animate([{ transform: `translate(${tx}px,${ty}px) rotate(0deg)` }, { transform: `translate(${tx}px,${ty}px) rotate(70deg)`, offset: 0.3 }, { transform: `translate(${tx}px,${ty}px) rotate(70deg)`, offset: 0.85 }, { transform: `translate(${tx}px,${ty}px) rotate(70deg)`, opacity: 0 }], { duration: 1500, fill: 'forwards' }).onfinish = () => el.remove();
      setTimeout(() => {
        sfx('pour');
        const stream = document.createElement('div');
        stream.className = 'fx';
        stream.style.cssText = `width:8px;height:60px;border-radius:4px;background:linear-gradient(#8a5a33,#6b4423);transform-origin:top;transform:translate(${x1 - 14}px,${y1 - 57}px) scaleY(0)`;
        document.body.appendChild(stream);
        stream.animate([{ transform: `translate(${x1 - 14}px,${y1 - 57}px) scaleY(0)` }, { transform: `translate(${x1 - 14}px,${y1 - 57}px) scaleY(1)`, offset: 0.3 }, { transform: `translate(${x1 - 14}px,${y1 - 57}px) scaleY(1)`, opacity: 1, offset: 0.8 }, { transform: `translate(${x1 - 14}px,${y1 - 2}px) scaleY(0)`, opacity: 0 }], { duration: 900, fill: 'forwards' }).onfinish = () => stream.remove();
        setTimeout(() => {
          const sn = fxEl(SVG.stain, x1 - 60, y1 - 50);
          sn.animate([{ transform: `translate(${x1 - 60}px,${y1 - 50}px) scale(.3)`, opacity: 0.9 }, { transform: `translate(${x1 - 60}px,${y1 - 50}px) scale(1)`, opacity: 1, offset: 0.1 }, { transform: `translate(${x1 - 60}px,${y1 - 50}px) scale(1)`, opacity: 1, offset: 0.7 }, { transform: `translate(${x1 - 60}px,${y1 - 50}px) scale(1)`, opacity: 0 }], { duration: 3200, fill: 'forwards' }).onfinish = () => sn.remove();
          const lb = document.createElement('div'); lb.className = 'fxlabel'; lb.textContent = T('coffeeLabel');
          document.body.appendChild(lb);
          const w = lb.offsetWidth;
          lb.style.left = Math.max(8, Math.min(innerWidth - w - 8, x1 - w / 2)) + 'px'; lb.style.top = Math.max(8, rb.top - 40) + 'px';
          lb.animate([{ opacity: 0 }, { opacity: 1, offset: 0.1 }, { opacity: 1, offset: 0.8 }, { opacity: 0 }], { duration: 2600, fill: 'forwards' }).onfinish = () => lb.remove();
          shake(to);
        }, 260);
      }, 420);
    };
  }
}
function shake(s) {
  const el = document.querySelector(`.pl[data-seat="${s}"]`);
  if (el && !reduceMotion) el.animate([{ transform: 'translateX(0)' }, { transform: 'translateX(-6px)' }, { transform: 'translateX(6px)' }, { transform: 'translateX(-4px)' }, { transform: 'translateX(0)' }], { duration: 350 });
}

// ================= 画面 =================
function cardEl(id, L, cls = '', mark = false, btn = false) {
  const c = G.card(id);
  const red = c.s === 'H' || c.s === 'D' || c.r === 17;
  const tag = btn ? 'button' : 'span';
  const attr = btn ? ` type="button" data-id="${id}" aria-pressed="${cls.includes('up')}"` : '';
  if (c.s === 'J') return `<${tag} class="cd joker ${red ? 'red' : ''} ${cls}"${attr} aria-label="${esc(cardNameL(id))}"><b>${esc(D().jokerFace[c.r - 16])}</b></${tag}>`;
  const wild = L && G.isWild(c, L);
  return `<${tag} class="cd ${red ? 'red' : ''} ${wild ? 'wild' : ''} ${cls}"${attr} aria-label="${esc(cardNameL(id) + (wild ? D().wildAria : ''))}"><b>${G.rname(c.r)}</b><i>${G.SUIT_CH[c.s]}</i>${wild ? `<em>${D().wildTag}</em>` : ''}${mark && id === G.MARKED ? '<u>★</u>' : ''}</${tag}>`;
}
const mini = (ids, L, mark) => `<div class="mini">${ids.map((i) => cardEl(i, L, '', mark)).join('')}</div>`;

function render() {
  const st = cur();
  document.querySelectorAll('.tab[data-r]').forEach((b) => b.setAttribute('aria-pressed', b.dataset.r === room));
  for (const r of ['r1', 'r2']) {
    const s = states[r], n = s ? s.seats.filter(Boolean).length : 0;
    $('#c' + r[1]).textContent = s && s.phase !== 'lobby' ? T('inGame') : T('people', { n });
  }
  renderSnd();
  if (fatal) { $('#stage').innerHTML = `<div class="note">${esc(T(fatal.k, fatal.p))}</div>`; $('#side').innerHTML = ''; return; }
  if (!ready) return;
  const me = st.seats.indexOf(uid);
  $('#stage').innerHTML = st.phase === 'lobby' ? lobbyHTML(st, me) : gameHTML(st, me);
  $('#side').innerHTML = sideHTML(st, me);
  $('#chatpanel').hidden = me < 0;
  const myTurn = st.g && st.g.turn === me && me >= 0 && st.phase === 'play';
  document.title = (myTurn ? T('yourTurnTitle') : '') + T('title');
  syncMusic();
}

function lobbyHTML(st, me) {
  const full = st.seats.every(Boolean);
  const seats = [0, 1, 2, 3].map((i) => {
    const u = st.seats[i];
    return `<button class="seat t${i % 2} ${u ? 'taken' : ''} ${u === uid ? 'me' : ''}" style="grid-area:s${i}" data-act="sit" data-i="${i}" ${u && u !== uid ? 'disabled' : ''}>
      <span class="tg t${i % 2}">${esc(teamName(i % 2))}</span>${esc(seatName(st, i))}<small>${esc(u ? (u === uid ? T('mySeat') : T('taken')) : T('seatClick'))}</small></button>`;
  }).join('');
  const help = esc(T('lobbyHelp')).replace('{A}', `<b style="color:var(--a)">${esc(teamName(0))}</b>`).replace('{B}', `<b style="color:var(--b)">${esc(teamName(1))}</b>`);
  return `<div class="felt lobby">${seats}
    <div class="info">
      <div class="lv">${esc(T(room === 'r1' ? 'room1' : 'room2'))}</div>
      <p>${help}</p>
      <button class="btn" data-act="start" ${full && me >= 0 ? '' : 'disabled'}>${esc(full ? T('start') : T('waitFour'))}</button>
      ${me >= 0 ? `<button class="btn ghost" data-act="leave">${esc(T('leave'))}</button>` : ''}
    </div></div>`;
}

function countHTML(st, s, me) {
  const g = st.g, di = g.done.indexOf(s);
  if (di >= 0) return `<span class="badge">${esc(posName(di))}</span>`;
  const n = g.hands[s].length;
  if (s === me) return esc(T('myCount', { n }));
  return n <= 10 ? `<span class="warn">${esc(T('left', { n }))}</span>` : '';
}
function playerHTML(st, s, pos, me) {
  const g = st.g, t = G.team(s);
  const turn = g.turn === s && st.phase === 'play';
  const name = seatName(st, s);
  const claim = me < 0 && uid ? `<button class="btn ghost small" data-act="claim" data-i="${s}">${esc(T('claim'))}</button>` : '';
  const acts = me >= 0 && s !== me ? `<div class="acts"><button type="button" data-act="throw" data-item="tomato" data-to="${s}" aria-label="${esc(T('tomatoAria', { name }))}" title="${esc(T('tomatoTitle'))}">🍅</button><button type="button" data-act="throw" data-item="coffee" data-to="${s}" aria-label="${esc(T('coffeeAria', { name }))}" title="${esc(T('coffeeTitle'))}">☕</button></div>` : '';
  return `<div class="pl pos-${pos} ${turn ? 'turn' : ''}" data-seat="${s}">${bubbleHTML(s)}<div class="nm">${esc(name)}<span class="tg t${t}">${esc(teamName(t))}</span></div><div class="meta">${countHTML(st, s, me)}</div>${acts}${claim}</div>`;
}
function slotHTML(st, s, pos) {
  const g = st.g, tk = g.trick[s];
  const turn = g.turn === s && st.phase === 'play';
  let inner = '';
  if (turn) inner = `<div class="think">${esc(T('thinking'))}</div>`;
  else if (tk) inner = tk.pass ? `<div class="ps">${esc(T('pass'))}</div>` : mini(tk.ids, g.L, st.round === 1) + `<small>${esc(trickLabel(tk))}</small>`;
  const old = !g.last && !turn ? 'old' : '';
  return `<div class="slot s-${pos} ${old}">${inner}</div>`;
}
function panelHTML(st, me) {
  const g = st.g;
  if (st.phase === 'tribute') {
    const rule = g.recv ? `<div class="lvl">${esc(T('tribRule'))}</div>` : '';
    const lines = g.trib.map((t) => {
      const card = t.id != null ? cardNameL(t.id) : '';
      let a = t.id == null ? T('tribPicking') : t.ret == null ? T('tribWaitRet', { card }) : T('tribDone', { card });
      if (t.to == null && t.id != null) a = T('tribHanded', { card });
      const to = t.to != null ? `<b>${esc(seatName(st, t.to))}</b>` : esc(T('tribToEither'));
      return `<li><b>${esc(seatName(st, t.from))}</b> → ${to}${esc(D().sep)}${esc(a)}</li>`;
    }).join('');
    return `<div class="panel"><div class="lvl">${esc(T('tribPanel', { r: st.round }))}</div><div class="lv">${G.rname(g.L)}</div>${rule}<ul class="res">${lines}</ul></div>`;
  }
  if (st.phase === 'roundEnd' || st.phase === 'matchEnd') {
    const p = st.prev;
    const list = p.order.map((s, i) => `<li>${esc(T('orderLine', { pos: posName(i), name: '\u0000', team: teamName(G.team(s)) })).replace('\u0000', `<b>${esc(seatName(st, s))}</b>`)}</li>`).join('');

  }
  return `<div class="center"><div class="lv">${G.rname(g.L)}</div></div>`;

function gameHTML(st, me) {
  const g = st.g;
  const base = me >= 0 ? me : 0;
  const pos = ['bot', 'right', 'top', 'left'];
  const seats = [0, 1, 2, 3].map((k) => (base + k) % 4);
  let turnMsg = '';
  if (st.phase === 'play') turnMsg = g.turn === me ? T('yourTurn') + (g.last ? '' : T('free')) : T('waitFor', { name: seatName(st, g.turn) });
  else if (st.phase === 'tribute') turnMsg = T('tribPhase');
  else turnMsg = T('roundEnd');
  const L = G.rname(g.L);
  const status = `<div class="status"><span>${esc(T('statusRound', { r: st.round }))}</span><span class="lvbig">${L}</span><span>${esc(g.lt < 0 ? T('bothFrom2') : T('teamLevel', { team: teamName(g.lt) }))} · ${esc(T('wilds', { L }))}</span><span class="turnmsg">${esc(turnMsg)}</span></div>`;
  const table = `<div class="felt table">${seats.map((s, k) => playerHTML(st, s, pos[k], me)).join('')}<div class="mid">${seats.map((s, k) => slotHTML(st, s, pos[k])).join('')}${panelHTML(st, me)}</div></div>`;
  if (me < 0) return status + table + `<div class="handwrap"><span class="small">${esc(T('spectate'))}</span></div>`;
  return status + table + handHTML(st, me);
}

function handHTML(st, me) {
  const g = st.g, hand = g.hands[me];
  const groups = getGroups(hand);
  const inG = new Set(groups.flat());
  const main = G.sortHand(hand.filter((id) => !inG.has(id)), g.L);
  const mark = st.round === 1;
  const ce = (id) => cardEl(id, g.L, (sel.has(id) ? 'up ' : '') + (drag && drag.ids.has(id) ? 'sweep' : ''), mark, true);
  const store = groups.length ? `<div class="store"><span class="lab">${esc(T('store'))}</span>${groups.map((gr) => `<div class="grp">${gr.map(ce).join('')}</div>`).join('')}</div>` : '';
  const selInStore = [...sel].some((id) => inG.has(id));
  const arrange = `<button class="btn sec" data-act="tostore" ${sel.size ? '' : 'disabled'}>${esc(T('toStore'))}</button>${selInStore ? `<button class="btn sec" data-act="unstore">${esc(T('unstore'))}</button>` : ''}`;
  const clear = `<button class="btn sec" data-act="clear" ${sel.size ? '' : 'disabled'}>${esc(T('clear'))}</button>`;
  let ctrl = '';
  if (st.phase === 'play' && g.turn === me) {
    const hint = g.last ? T('beatHint', { name: seatName(st, g.last.seat), label: trickLabel(g.trick[g.last.seat] || g.last), key: keyNameL(g.last, g.L) }) : T('leadHint');
    ctrl = `<button class="btn" data-act="play" ${sel.size ? '' : 'disabled'}>${esc(T('play'))}</button>
      <button class="btn sec" data-act="pass" ${g.last ? '' : 'disabled'}>${esc(T('pass'))}</button>${clear}${arrange}<span class="hint">${esc(hint)}</span>`;
  } else if (st.phase === 'tribute') {
    const give = g.trib.find((x) => x.from === me && x.id == null);
    const back = g.trib.find((x) => x.to === me && x.to != null && x.id != null && x.ret == null);
    if (give) ctrl = `<button class="btn" data-act="tribute" ${sel.size === 1 ? '' : 'disabled'}>${esc(give.to != null ? T('giveTo', { name: seatName(st, give.to) }) : T('handIn'))}</button><span class="hint">${esc(T('giveHint'))}</span>`;
    else if (back) ctrl = `<button class="btn" data-act="back" ${sel.size === 1 ? '' : 'disabled'}>${esc(T('backTo', { name: seatName(st, back.from) }))}</button><span class="hint">${esc(T('backHint'))}</span>`;
    else ctrl = `<span class="hint">${esc(T('waitTrib'))}</span>`;
  } else if (st.phase === 'play') {
    ctrl = `${clear}${arrange}<span class="hint">${esc(g.done.includes(me) ? T('doneWait') : T('notTurn'))}</span>`;
  } else ctrl = arrange;
  const ch = choice ? `<div class="choose"><span class="hint">${esc(T('chooseHint'))}</span>${choice.map((o) => `<button class="btn sec" data-act="playas" data-t="${o.type}">${esc(describeL(o) + ' ' + keyNameL(o, g.L))}</button>`).join('')}</div>` : '';
  return `<div class="handwrap"><div class="small">${esc(T('handTitle', { n: hand.length }))}</div><div class="hand">${main.map(ce).join('')}</div>${store}<div class="ctrl">${ctrl}</div>${ch}</div>`;
}

function chatLine(st, m) {
  let text = m.text;
  if (m.kind === 'act') text = T(m.item === 'tomato' ? 'actTomato' : 'actCoffee', { name: m.to != null ? seatName(st, m.to).replace(D().you, '') : '' });
  else if (m.p != null && D().phrases[m.p]) text = D().phrases[m.p];
  if (m.kind === 'stk') { const s = stk(m.text); if (s) return `<li><b>${esc(m.name || seatName(st, m.seat))}</b>${esc(D().sep)}<img class="inl" src="${s.src}" alt="${esc(stkName(s))}"></li>`; }
  return `<li><b>${esc(m.name || seatName(st, m.seat))}</b>${esc(D().sep)}${esc(text)}</li>`;
}
function sideHTML(st, me) {
  const teams = [0, 1].map((t) => `<div class="team"><span class="tg t${t}">${esc(teamName(t))}</span><span class="who">${esc(seatName(st, t))}<br>${esc(seatName(st, t + 2))}</span><span class="lvn">${G.rname(st.levels[t])}</span></div>
     ${st.levels[t] === 14 && st.aFails[t] ? `<div class="small">${esc(T('aFails', { n: st.aFails[t] }))}</div>` : ''}`).join('');
  let reset = '';
  if (st.phase !== 'lobby' && st.phase !== 'matchEnd' && me >= 0) {
    const voted = (st.votes || []).includes(uid);
    reset = `<div class="card"><h3>${esc(T('resetTitle'))}</h3><p class="small" style="margin:0 0 10px">${esc(T('resetText', { n: (st.votes || []).length }))}</p>
      <button class="btn sec" data-act="${voted ? 'unvote' : 'vote'}">${esc(voted ? T('unvoteBtn') : T('voteBtn'))}</button></div>`;
  }
  const chat = chats[room].slice(-8).reverse().map((m) => chatLine(st, m)).join('');
  const logs = st.log.slice(-14).reverse().map((m) => `<li>${logHTML(st, m)}</li>`).join('');
  return `<div class="card"><h3>${esc(T('levels'))}</h3>${teams}</div>${reset}<div class="card"><h3>${esc(T('chat'))}</h3><ul class="log">${chat || `<li class="small">${esc(T('noChat'))}</li>`}</ul></div><div class="card"><h3>${esc(T('logT'))}</h3><ul class="log">${logs || `<li class="small">${esc(T('noLog'))}</li>`}</ul></div>
   <div class="card small">${esc(T('saved'))}</div>`;
}

// ================= 数据读写 =================
async function txWrite(col, r, fn) {
  await runTransaction(db, async (tx) => {
    const ref = doc(db, col, r);
    const snap = await tx.get(ref);
    tx.set(ref, { s: JSON.stringify(fn(snap.exists() ? JSON.parse(snap.data().s) : null)) });
  });
}
async function mutate(fn) {
  if (!db || !uid) { toast(T('noDb')); return; }
  try {
    await txWrite('rooms', room, (st0) => { const st = st0 || G.fresh(); const v = st.v || 0; const next = fn(st); next.v = v + 1; return next; });
    return true;
  } catch (e) {
    toast(e && e.code === 'permission-denied' ? T('denied') : errText(e));
  }
}
async function chatWrite(r, fn) {
  try { await txWrite('chat', r, (l) => fn(l || [])); }
  catch (e) { toast(e && e.code === 'permission-denied' ? T('chatDenied') : T('chatFail')); }
}
function needNick() { if (!nick.trim()) { toast(T('needNick')); $('#nick').focus(); return false; } return true; }
function withName(s) { s.names = s.names || {}; s.names[uid] = nick.trim(); return s; }

function onState() {
  const st = cur(), me = st.seats.indexOf(uid);
  const hand = st.g && me >= 0 ? st.g.hands[me] : [];
  for (const id of [...sel]) if (!hand.includes(id)) sel.delete(id);
  if (!(st.phase === 'play' && st.g && st.g.turn === me)) choice = null;
  render();
}

// ================= 选牌：点击或按住滑动 =================
let drag = null;
const cardAt = (x, y) => { const el = document.elementFromPoint(x, y); const b = el && el.closest('.handwrap button.cd[data-id]'); return b ? +b.dataset.id : null; };
document.addEventListener('pointerdown', (e) => {
  const b = e.target.closest('.handwrap button.cd[data-id]');
  if (!b || e.button > 0) return;
  e.preventDefault();
  const id = +b.dataset.id;
  drag = { ids: new Set([id]), adding: !sel.has(id) };
  b.classList.add('sweep');
});
document.addEventListener('pointermove', (e) => {
  if (!drag) return;
  const id = cardAt(e.clientX, e.clientY);
  if (id != null && !drag.ids.has(id)) { drag.ids.add(id); const el = document.querySelector(`.handwrap button.cd[data-id="${id}"]`); if (el) el.classList.add('sweep'); }
});
function endDrag() {
  if (!drag) return;
  const d = drag; drag = null;
  if (cur().phase === 'tribute') { const id = [...d.ids].pop(); sel = sel.has(id) && d.ids.size === 1 ? new Set() : new Set([id]); }
  else for (const id of d.ids) d.adding ? sel.add(id) : sel.delete(id);
  choice = null;
  render();
}
document.addEventListener('pointerup', endDrag);
document.addEventListener('pointercancel', endDrag);

document.addEventListener('click', async (e) => {
  const cardBtn = e.target.closest('button.cd[data-id]');
  if (cardBtn) {
    if (e.detail === 0) { const id = +cardBtn.dataset.id; sel.has(id) ? sel.delete(id) : sel.add(id); choice = null; render(); }
    return;
  }
  const t = e.target.closest('[data-act]');
  if (!t || t.disabled) return;
  const a = t.dataset.act;
  const st = cur(), me = st.seats.indexOf(uid);
  if (a === 'snd') { opt[t.dataset.k] = !opt[t.dataset.k]; ls.set('gd-snd', opt); lobby.on = undefined; if (!opt.voice && 'speechSynthesis' in window) speechSynthesis.cancel(); render(); return; }
  if (a === 'lang') { lang = lang === 'zh' ? 'en' : 'zh'; ls.set('gd-lang', lang); applyStatic(); render(); return; }
  if (a === 'emo') { sendChat('emo', t.dataset.v); return; }
  if (a === 'stk') { sendChat('stk', t.dataset.v); return; }
  if (a === 'throw') { sendThrow(t.dataset.item, +t.dataset.to); return; }
  if (a === 'say') { sendChat('text', I18N.zh.phrases[+t.dataset.v], +t.dataset.v); return; }
  if (a === 'room') { room = t.dataset.r; history.replaceState(null, '', room === 'r2' ? '#room2' : '#room1'); sel.clear(); choice = null; onState(); return; }
  if (a === 'clear') { sel.clear(); choice = null; render(); return; }
  if (a === 'tostore' || a === 'unstore') {
    const hand = st.g.hands[me];
    let gs = getGroups(hand).map((g) => g.filter((id) => !sel.has(id)));
    if (a === 'tostore') gs.push(G.sortHand([...sel], st.g.L));
    setGroups(gs); sel.clear(); choice = null; render(); return;
  }
  if (a === 'sit') { if (!needNick()) return; return mutate((s) => withName(G.sit(s, uid, +t.dataset.i))); }
  if (a === 'claim') {
    if (!needNick()) return;
    const i = +t.dataset.i;
    return mutate((s) => {
      if (s.seats.includes(uid)) throw new Error(T('haveSeat'));
      const old = s.seats[i];
      if (!old || ((s.names || {})[old] || '') !== nick.trim()) throw new Error(T('nickMismatch'));
      s.seats[i] = uid; s.votes = (s.votes || []).map((v) => (v === old ? uid : v));
      return withName(s);
    });
  }
  if (a === 'leave') return mutate((s) => G.leave(s, uid));
  if (a === 'start') return mutate((s) => withName(G.start(s, uid, rand)));
  if (a === 'next') return mutate((s) => G.nextRound(s, uid, rand));
  if (a === 'pass') { sel.clear(); choice = null; return mutate((s) => G.pass(s, uid)); }
  if (a === 'vote') return mutate((s) => G.vote(s, uid, true));
  if (a === 'unvote') return mutate((s) => G.vote(s, uid, false));
  if (a === 'reset') return mutate((s) => G.vote(s, uid, true));
  if (a === 'tribute') { const id = [...sel][0]; if (await mutate((s) => G.giveTribute(s, uid, id))) { sel.clear(); render(); } return; }
  if (a === 'back') { const id = [...sel][0]; if (await mutate((s) => G.giveBack(s, uid, id))) { sel.clear(); render(); } return; }
  if (a === 'play' || a === 'playas') {
    const ids = [...sel];
    let type = null;
    if (a === 'play') {
      const opts = G.options(st, ids);
      if (!opts.length) { toast(D().err[st.g.last ? 'cantBeat' : 'invalidType']); return; }
      if (opts.length > 1) { choice = opts; render(); return; }
      type = opts[0].type;
    } else type = t.dataset.t;
    if (await mutate((s) => G.play(s, uid, ids, type))) { sel.clear(); choice = null; render(); }
  }
});

applyStatic();
$('#nick').value = nick;
$('#nick').addEventListener('input', (e) => { nick = e.target.value; ls.set('gd-nick', nick); });
renderSnd();
(async () => {
  if (!firebaseConfig.projectId) { fatal = { k: 'noConfig' }; render(); return; }
  const timer = setTimeout(() => { if (!ready) { fatal = { k: 'noConn' }; render(); } }, 12000);
  try {
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    db = getFirestore(app);
    onAuthStateChanged(auth, (u) => {
      if (!u || uid) return;
      uid = u.uid;
      buildChat();
      for (const r of ['r1', 'r2']) {
        onSnapshot(doc(db, 'chat', r), (snap) => onChat(r, snap.exists() ? JSON.parse(snap.data().s) : []), () => {});
        onSnapshot(doc(db, 'rooms', r), (snap) => {
          clearTimeout(timer);
          ready = true; fatal = null;
          states[r] = snap.exists() ? JSON.parse(snap.data().s) : null;
          if (states[r]) handleEvent(r, states[r]); else evSeen[r] = 0;
          onState();
        }, (e) => { clearTimeout(timer); fatal = { k: 'readFail', p: { c: e.code } }; render(); });
      }
    });
    await signInAnonymously(auth);
  } catch (e) { clearTimeout(timer); fatal = { k: 'fbFail', p: { c: e.code || e.message } }; render(); }
})();
}
</script>
